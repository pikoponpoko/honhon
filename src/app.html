<style>
/* Layout: header / pages | spread stage | inspector — a production tool, flat and dense.
   Colors, type, radius and focus follow the Digital Agency Design System (DADS) primitives. */
:root{
  /* Same palette as Tehon / Soku Conte: green-gray paper, ink #1B2530, blue #3772FF, red #DF2935, yellow #FDCA40 */
  --bg:#E8EFEA; --panel:#E8EFEA; --stage:#DAE5DE; --btn:#FFFFFF; --ink:#1B2530; --sub:#526470; --line:#BCCCC3; --field:#84998E; --hover:#F6F9F7;
  --accent:#3772FF; --accent-hover:#2F5FD9; --accent-active:#2A52B8; --accent-soft:#D2DED6; --accent-ink:#FFFFFF; --accent-text:#1B2530;
  --danger:#C0392B; --warn:#DF2935; --guide:#A065E0; --paper:#FFFFFF; --focus:#1B2530; --scrim:rgba(16,24,23,0.5);
  --ui:"Noto Sans JP","BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:"Noto Sans Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px; --r-dlg:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#172120; --panel:#172120; --stage:#101817; --btn:#2A3835; --ink:#E6EEE9; --sub:#98AAA2; --line:#2C3A36; --field:#54685F; --hover:#1F2B29;
  --accent:#5B8CFF; --accent-hover:#7AA2FF; --accent-active:#99B8FF; --accent-soft:#1F2B29; --accent-ink:#101817; --accent-text:#5B8CFF;
  --danger:#F0625B; --warn:#FDCA40; --guide:#A065E0; --paper:#FFFFFF; --focus:#E6EEE9; --scrim:rgba(16,24,23,0.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#172120; --panel:#172120; --stage:#101817; --btn:#2A3835; --ink:#E6EEE9; --sub:#98AAA2; --line:#2C3A36; --field:#54685F; --hover:#1F2B29;
  --accent:#5B8CFF; --accent-hover:#7AA2FF; --accent-active:#99B8FF; --accent-soft:#1F2B29; --accent-ink:#101817; --accent-text:#5B8CFF;
  --danger:#F0625B; --warn:#FDCA40; --guide:#A065E0; --paper:#FFFFFF; --focus:#E6EEE9; --scrim:rgba(16,24,23,0.7); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;letter-spacing:.02em;overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable],[contenteditable] *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:var(--btn);border:1px solid var(--line);border-radius:var(--r);padding:4px 12px;min-height:32px;min-width:32px;cursor:pointer;line-height:21px;white-space:nowrap}
button:hover{border-color:var(--field)}
button:active{background:var(--stage)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.primary:active{background:var(--accent-active);border-color:var(--accent-active)}
button.on{background:var(--accent-soft);border-color:var(--accent);outline:1px solid var(--accent);outline-offset:-2px;color:var(--accent-text);font-weight:700}
button.on:hover{background:var(--accent-soft);border-color:var(--accent)}
button.on:active{background:var(--accent-soft)}
button.danger{color:var(--danger);border-color:var(--danger)}
button:disabled,button:disabled:hover{background:var(--panel);border-color:var(--line);color:var(--sub);text-decoration:none;cursor:default}
input,select,textarea{background:var(--btn);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;min-width:0}
input:not([type=checkbox]):not([type=radio]):not([type=range]),select{min-height:32px}
input:hover:not(:disabled):not([readonly]),select:hover:not(:disabled),textarea:hover:not(:disabled):not([readonly]){border-color:var(--field)}
input:disabled,select:disabled,textarea:disabled{background:var(--panel);color:var(--sub);border-color:var(--line)}
input[readonly],textarea[readonly]{background:var(--panel)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0}
input[type=number]{font-family:var(--num);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);min-width:0;position:relative;z-index:12}
.hr{display:flex;align-items:center;gap:8px;min-width:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.hr1{height:48px}.hr2{height:40px}
.hr>*{flex:none}
.hr .sp{flex:1}
.vr{width:1px;height:20px;background:var(--line);margin:0 8px}
.ic{width:16px;height:16px;flex:none;display:block}
button.i{width:32px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.logo{font-weight:700;width:112px}
.mnu{position:relative}
.mb{display:inline-flex;align-items:center;justify-content:space-between;gap:8px}
#mDoc .mb{width:112px}
.mp{position:absolute;left:0;top:calc(100% + 4px);width:240px;max-height:calc(100dvh - 112px);overflow:auto;background:var(--bg);border:1px solid var(--field);border-radius:var(--r);padding:4px;display:flex;flex-direction:column;z-index:40}
.mp[hidden]{display:none!important}
.mp button{border:0;border-radius:var(--r);background:transparent;text-align:left;min-height:36px;padding:0 12px;width:100%}
.mp button:hover{background:var(--hover)}.mp button:focus-visible{outline-offset:-2px}.mp button:active{background:var(--stage)}
.mp button.on{border:0;outline:0;background:var(--accent-soft)}.mp button.on:focus-visible{outline:2px solid var(--focus)}
.shh{display:none;justify-content:flex-end;align-items:center;flex:none;padding:0 4px;background:var(--panel)}
.shx{border:0;background:transparent}
#bSide,#mbar{display:none}
.ls{display:none}
.logo .hm{display:none}
.mp .mqd{display:none;flex-direction:column;border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.mp .mq{display:none;flex-direction:column;border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:4px}
.gfile button{min-width:52px}
#bExport{min-width:216px}#bPptx{min-width:160px}
#bGuide{min-width:72px}#bPres{min-width:128px}
.grp{display:flex;gap:4px;align-items:center}
#zoomLbl{font-family:var(--num);font-variant-numeric:tabular-nums;width:64px;text-align:center}
#app.k-slide header .bk-only,#app:not(.k-slide) header .sl-only{display:none}
#app.k-master .ph .grp,#app.k-master .tabs [data-tab=notes]{display:none}
.tslot.mlay{padding-left:16px}
#docInfo{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{border-left:1px solid var(--line);display:flex;flex-direction:column}
.tools{display:flex;flex-direction:column;gap:4px;padding:12px}
.tools button{display:flex;align-items:center;gap:8px;border-color:transparent;background:transparent;text-align:left}
.tools button:hover{background:var(--hover)}
.tools button.on{background:var(--accent-soft);border-color:var(--accent)}
.ph{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;margin-top:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700;flex:none}
#pages{padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1}
.tsp{display:flex;justify-content:center;gap:4px}
.tslot{display:flex;flex-direction:column;align-items:center;gap:4px}
.thumb{border:1px solid var(--line);background:var(--paper);cursor:pointer;display:block}
.thumb:hover{border-color:var(--field)}
.thumb.cur{outline:2px solid var(--accent);outline-offset:-1px}
.tno{font-family:var(--num);font-size:12px;line-height:18px;color:var(--sub);padding:0 4px}
.thumb.cur+.tno{background:var(--accent-soft);color:var(--accent)}
#app.k-slide #pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
#app.k-slide .tsp,#app.k-slide .tslot{min-width:0!important}
#app.k-slide .tslot{align-items:stretch}#app.k-slide .tno{align-self:center}
#app.k-slide .thumb{width:100%!important;height:auto!important;aspect-ratio:16/9}
#stage{background:var(--stage);overflow:auto;position:relative;min-width:0}
#spreads{display:flex;flex-direction:column;align-items:center;gap:32px;padding:24px;min-width:max-content}
.spread{display:flex;gap:16px;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.page{position:relative;background:var(--paper);touch-action:none}
.page canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0}
.pno{font-family:var(--num);font-size:12px;color:var(--sub)}
.dwr{display:grid;grid-template-columns:84px minmax(0,1fr) 64px 32px;gap:4px;margin-bottom:4px}
.dwh{color:var(--sub);font-size:12px;margin:0}
.tno{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ined{position:absolute;z-index:2;background:var(--paper);border:1px solid var(--accent);padding:0;margin:0;resize:none;outline:none;overflow:auto;border-radius:0}
.selbox{position:absolute;border:1px solid var(--accent);pointer-events:none}
.selbox .h{position:absolute;width:8px;height:8px;background:var(--bg);border:1px solid var(--accent);pointer-events:auto;margin:-5px 0 0 -5px}
.tmpbox{position:absolute;border:1px dashed var(--accent)}
.selbox.key{border-width:2px;margin:-1px 0 0 -1px}
.sguide{position:absolute;pointer-events:none}.sguide.v{top:0;bottom:0;border-left:1px solid var(--guide)}.sguide.h{left:0;right:0;border-top:1px solid var(--guide)}
.alg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.alg button,.dist button{padding:0;display:flex;align-items:center;justify-content:center}
.dist{display:grid;grid-template-columns:minmax(0,1fr) 40px 40px;gap:4px;align-items:end}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
#app.k-slide:not(.k-master) .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
.pfrow{display:flex;align-items:center;gap:8px;min-height:32px;height:32px;padding:0 12px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;width:100%}
.pfrow:focus-visible{outline-offset:-2px}
.pfrow .badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--ui)}
.pfrow .badge .ic{width:12px;height:12px}
.badge.z,.badge.w.z{border-color:var(--line);background:var(--btn);color:var(--sub)}
.tabs button{flex:1 1 auto;white-space:nowrap;border:0;border-radius:0;background:transparent;padding:0 8px;min-height:36px;border-bottom:2px solid transparent}
.tabs button:hover{background:var(--hover)}.tabs button:active{background:var(--stage)}
.tabs button:focus-visible{outline-offset:-2px}
.tabs button.on{color:var(--accent);background:transparent;border-bottom:2px solid var(--accent);outline:0;font-weight:700;text-decoration:none}
.tabs button.on:focus-visible{outline:2px solid var(--focus)}
.tab{padding:12px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{margin:0;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.02em}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.f.w{grid-column:1/-1}
.pops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.pops>button:nth-child(-n+2){grid-column:1/-1}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;line-height:18px;color:var(--sub)}
.f>input,.f>select{width:100%}
.chk{display:flex;align-items:center;gap:8px}
textarea#tText{width:100%;min-height:128px;resize:vertical;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.pf{display:flex;flex-direction:column;gap:4px}
.pfi{display:grid;grid-template-columns:8px 44px minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:1px solid var(--line);padding:6px 8px;background:var(--bg)}
.pfi i{width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--sub)}
.pfi.err i{background:var(--danger)}
.pfi.warn i{background:#FDCA40}
.pfi b{font-family:var(--num);font-weight:400;color:var(--sub)}
.badge{display:inline-block;min-width:20px;height:20px;padding:0 4px;border-radius:4px;border:1px solid var(--danger);background:var(--bg);color:var(--danger);font-size:12px;line-height:18px;font-weight:700;font-family:var(--num);text-align:center}
.badge.w{border-color:#FDCA40;background:#FDCA40;color:#1B2530}
.ok{color:var(--sub)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;padding:3px 0}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent-hover);text-decoration-thickness:2px}
.pfi.hp{grid-template-columns:8px minmax(0,1fr);cursor:default}
.hpt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:8px;border:1px solid var(--line);border-radius:var(--r)}
.hpt>span{color:var(--sub)}
.pppv{display:block;margin:4px auto;border:1px solid var(--line)}
#app.k-master #bProp{display:none}
.hpd{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;font-family:var(--num);font-size:12px}
.hps{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;align-items:center}
.hps>b{font-weight:400;color:var(--sub);text-align:right}
.hph>span{color:var(--sub);text-align:center}
.hpf{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:var(--bg)}
.hpf>i{font-style:normal;text-align:center;line-height:28px;color:var(--ink)}
.hpf>i+i{border-left:1px dashed var(--line)}
.hpf>i.b{color:var(--sub)}
.lf-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);max-height:min(360px,50vh);overflow:auto}
.lf-i{border:0;border-radius:0;text-align:left;padding:6px 12px;font-size:16px;line-height:24px;min-height:37px;background:transparent;content-visibility:auto;contain-intrinsic-size:auto 37px;flex:none}
.lf-i+.lf-i{border-top:1px solid var(--line)}
.lf-st{margin:0;color:var(--sub);font-size:12px}.lf-st:empty{display:none}
.dbx-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.dbx-g{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px}
.dbx-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:6px 8px}
.dbx-i b{font-family:var(--num);font-weight:400}
.dbx-i span{font-family:var(--num);font-size:12px;color:var(--sub)}
#dbx-msg.err{color:var(--danger)}
#neta{grid-column:1/-1;grid-row:1/-1;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);min-height:0;background:var(--bg)}
#app.neta-on{grid-template-rows:minmax(0,1fr)}
.tbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;height:48px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line);min-width:0}
.tbar>*{flex:none}.tbar .sp{flex:1 1 0}
.tbar h2{margin:0;font-size:16px;line-height:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
#app.neta-on>#left,#app.neta-on>#stage,#app.neta-on>#right,#app.neta-on>#mbar{display:none!important}
#app.neta-on>header{display:none}
#nList{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nbar{display:flex;flex-direction:column;gap:8px;padding:12px}
.nbar input{width:100%}
.ntags{display:flex;flex-wrap:wrap;gap:4px}.ntags:empty{display:none}

.nit b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#nTitle{font-size:16px;font-weight:700;padding:6px 8px}

#nImgAdd{display:flex;align-items:center;justify-content:center;padding:0}
.nimgs.drop{outline:2px dashed var(--accent);outline-offset:2px}
.nact{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between}

  #neta{grid-template-columns:minmax(0,1fr);grid-template-rows:40px auto auto;align-content:start;overflow:auto}

  #nEdit{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.kp{display:flex;flex-direction:column;gap:10px}
.kr{display:flex;flex-direction:column;gap:6px}
.kr>span{font-size:13px;color:var(--sub)}
.kcs{display:flex;gap:6px;flex-wrap:wrap}
.kc{flex:0 0 32px;width:32px;height:32px;min-width:0;min-height:0;padding:0;border:1px solid var(--line);position:relative;overflow:hidden}
.kc.on{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:1px}

.ktg{display:flex;gap:8px}

.ksv{position:relative;height:140px;touch-action:none;cursor:crosshair;border:1px solid var(--line);background:linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,hsl(var(--h),100%,50%))}
.ksv b{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;outline:1px solid #1a1a1a;border-radius:50%;pointer-events:none}

.khue{-webkit-appearance:none;appearance:none;width:100%;height:16px;margin:0;padding:0;border:1px solid var(--line);background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);min-height:0}

      else if(depth===16)for(let x=0;x<w;x++)pl[base+x]=row[x*2];

  try{const im=await readImage(file);const id=uid();S.images[id]=im;it.imageId=id;if(handle){handles[id]=handle;saveHandles()}
    sepCache.clear();dirty(S.sel?S.sel.page:S.page);commit();renderProps()}catch(e){toast(e.message)}}
async function pickImage(it){
  if(window.showOpenFilePicker){
    try{const [h]=await window.showOpenFilePicker({types:[{description:'画像',accept:{'image/*':['.png','.jpg','.jpeg','.psd','.webp','.gif','.bmp']}}]});await placeImageInto(it,await h.getFile(),h);return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  bgPick=null;imgTarget=it;$('#fImg').click();
}
function saveHandles(){const o={};for(const [id,h] of Object.entries(handles))if(S.images[id])o[id]=h;kvSet('handles',o)}
let linkBusy=false;
async function checkLinks(force){
  if(linkBusy||!S.doc)return;linkBusy=true;
  try{for(const [id,h] of Object.entries(handles)){
    const im=S.images[id];if(!im)continue;
    try{if(h.queryPermission&&await h.queryPermission({mode:'read'})!=='granted'){im.lost=true;continue}
      const f=await h.getFile();im.lost=false;
      if(force||f.lastModified!==im.mtime){const n=await readImage(f);Object.assign(im,n);sepCache.clear();
        S.doc.pages.forEach((p,i)=>{if(p.items.some(x=>x.imageId===id))dirty(i)});autosave();toast('画像を更新しました：'+f.name)}}
    catch(e){im.lost=true}
  }}finally{linkBusy=false}
}
async function relink(id){const h=handles[id];if(!h)return;try{if(h.requestPermission&&await h.requestPermission({mode:'read'})==='granted'){await checkLinks(true);renderProps()}}catch(e){toast('再接続できませんでした')}}
setInterval(()=>{if(document.visibilityState==='visible'&&Object.keys(handles).length)checkLinks()},2000);
window.addEventListener('focus',()=>checkLinks());

/* ---------- align / page ops ---------- */
function alignBox(pi,ref){const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH;
  if(ref==='trim')return{x:0,y:0,w:W,h:H};if(ref==='bleed')return{x:-b,y:-b,w:W+2*b,h:H+2*b};
  return d.kind==='cover'?{x:d.margins.outer,y:d.margins.top,w:W-2*d.margins.outer,h:H-d.margins.top-d.margins.bottom}:margBox(pi)}
function bboxOf(its){const x0=Math.min(...its.map(o=>o.x)),y0=Math.min(...its.map(o=>o.y)),x1=Math.max(...its.map(o=>o.x+o.w)),y1=Math.max(...its.map(o=>o.y+o.h));return{x:x0,y:y0,w:x1-x0,h:y1-y0}}
function alignRefOf(){return multi()?(S.alignRefM||'sel'):(S.alignRef||'margin')}
function alignSel(how){const its=selItems();if(!its.length)return;const pi=S.sel.page,ref=alignRefOf(),key=selItem();
  let r,movers=its,each=false;
  if(ref==='sel')r=bboxOf(its);else if(ref==='key'){r={x:key.x,y:key.y,w:key.w,h:key.h};movers=its.filter(o=>o!==key)}else{r=alignBox(pi,ref);each=true}
  if(how==='fit'&&its.length>1)return;
  for(const it of movers){
    if(how==='l')it.x=r.x;else if(how==='c')it.x=r.x+(r.w-it.w)/2;else if(how==='r')it.x=r.x+r.w-it.w;
    else if(how==='t')it.y=r.y;else if(how==='m')it.y=r.y+(r.h-it.h)/2;else if(how==='b')it.y=r.y+r.h-it.h;
    else if(how==='fit'){it.x=r.x;it.y=r.y;it.w=r.w;it.h=r.h}
    it.x=r1(it.x);it.y=r1(it.y);it.w=r1(it.w);it.h=r1(it.h)}
  dirty(pi);commit();renderProps()}
/* 等間隔：gap 指定なしは両端を固定して間隔をそろえる。基準が版面などのときはその枠の両端まで広げる */
function distSel(axis,gap){const its=selItems();if(!its.length)return;const pi=S.sel.page,ref=alignRefOf(),X=axis==='x',P=X?'x':'y',L=X?'w':'h';
  const a=its.slice().sort((p,q)=>(p[P]+p[L]/2)-(q[P]+q[L]/2));const sum=a.reduce((t,o)=>t+o[L],0);
  if(gap!=null&&!isNaN(gap)){if(a.length<2)return;const key=selItem(),ki=ref==='key'?a.indexOf(key):0;
    let pos=a[ki][P];for(let i=ki+1;i<a.length;i++){pos+=a[i-1][L]+gap;a[i][P]=r1(pos)}
    pos=a[ki][P];for(let i=ki-1;i>=0;i--){pos-=gap+a[i][L];a[i][P]=r1(pos)}}
  else{let lo,hi;if(ref==='sel'||ref==='key'){if(a.length<3)return;const b=bboxOf(a);lo=b[P];hi=b[P]+b[L]}else{const b=alignBox(pi,ref);lo=b[P];hi=b[P]+b[L]}
    const g=a.length>1?(hi-lo-sum)/(a.length-1):0;let pos=a.length>1?lo:lo+(hi-lo-sum)/2;for(const o of a){o[P]=r1(pos);pos+=o[L]+g}}
  dirty(pi);commit();renderProps()}
function sizeSel(k){const key=selItem();if(!key)return;for(const o of selItems())o[k]=key[k];dirty(S.sel.page);commit();renderProps()}
function dupPage(i){const d=S.doc,c=JSON.parse(JSON.stringify(d.pages[i]));c.id=uid();const map={};for(const it of c.items){const n=uid();map[it.id]=n;it.id=n}
  for(const it of c.items)if(it.next)it.next=map[it.next]||null;
  d.pages.splice(i+1,0,c);rebuild();commit();setPage(i+1);toast('ページを複製しました')}
function movePage(i,dir){const d=S.doc,j=i+dir;if(j<0||j>=d.pages.length)return;const [p]=d.pages.splice(i,1);d.pages.splice(j,0,p);S.sel=null;rebuild();commit();S.page=-1;setPage(j);renderProps()}

/* ---------- interaction ---------- */
function toMM(e,el){const r=el.getBoundingClientRect(),b=S.doc.bleed;return{x:(e.clientX-r.left)/S.s-b,y:(e.clientY-r.top)/S.s-b}}
function hit(pi,p){const its=S.doc.pages[pi].items;for(let k=its.length-1;k>=0;k--){const it=its[k];if(p.x>=it.x&&p.x<=it.x+it.w&&p.y>=it.y&&p.y<=it.y+it.h)return it}return null}
function snapLines(pi,ex){const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,m=d.kind==='cover'?{x:d.margins.outer,y:d.margins.top,w:W-2*d.margins.outer,h:H-d.margins.top-d.margins.bottom}:margBox(pi);
  const xs=[-b,0,W/2,W,W+b,m.x,m.x+m.w],ys=[-b,0,H/2,H,H+b,m.y,m.y+m.h];if(d.kind==='cover')xs.push(d.trimW,d.trimW+d.spine);
  for(const o of d.pages[pi].items){if(ex&&ex.has(o.id))continue;xs.push(o.x,o.x+o.w/2,o.x+o.w);ys.push(o.y,o.y+o.h/2,o.y+o.h)}return{xs,ys}}
/* g を渡すと吸着した線を記録（ドラッグ中のガイド表示用）。Alt を押している間は吸着しない */
function snap1(vals,lines,g){if(S.noSnap)return 0;const th=6/S.s;let best=null;for(const v of vals)for(const l of lines){const dd=l-v;if(Math.abs(dd)<th&&(best===null||Math.abs(dd)<Math.abs(best)))best=dd}
  if(best===null)return 0;if(g)for(const v of vals)for(const l of lines)if(Math.abs(l-v-best)<0.01&&!g.includes(l))g.push(l);return best}
spreadsEl.addEventListener('pointerdown',e=>{
  if(e.target.classList.contains('ined'))return;

  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(S.tool==='select'){
    if(e.target.classList.contains('h')){const it=selItem();S.drag={mode:'resize',pi,id:it.id,dir:e.target.dataset.d,p0:p,o:{x:it.x,y:it.y,w:it.w,h:it.h}}}
    else{const it=hit(pi,p),touch=e.pointerType==='touch',pl=it&&inl&&inl.id===it.id?it.id:playHit(it,p)?it.id:null;if(!pl||!inl||inl.id!==pl)stopInline();
      const add=!touch&&(e.shiftKey||e.ctrlKey||e.metaKey);
      if(touch&&!(it&&isSel(pi,it.id))){S.drag={mode:'pan',pi,tap:it?it.id:null,x0:e.clientX,y0:e.clientY,sl:stage.scrollLeft,st:stage.scrollTop,moved:false,play:pl}}
      else if(it&&add){toggleSel(pi,it.id);e.preventDefault();return}
      else if(it){const grp=multi()&&isSel(pi,it.id);if(!grp)select(pi,it.id);const os={};for(const o of selItems())os[o.id]={x:o.x,y:o.y,w:o.w,h:o.h};
        S.drag={mode:'move',pi,id:it.id,grp,os,p0:p,o:{x:it.x,y:it.y,w:it.w,h:it.h},x0:e.clientX,y0:e.clientY,live:!touch&&!pl&&!grp,play:pl}}
      else if(!touch){if(!add)select(null);S.drag={mode:'marquee',pi,p0:p,rect:null,add,base:add&&S.sel&&S.sel.page===pi?selIds():[]}}
      else{select(null);return}}
  }else S.drag={mode:'create',pi,p0:p,rect:null};
  pg.setPointerCapture(e.pointerId);e.preventDefault();
});
spreadsEl.addEventListener('pointermove',e=>{
  const D=S.drag;if(!D)return;if(D.mode==='pan'){if(!D.moved&&Math.hypot(e.clientX-D.x0,e.clientY-D.y0)>8)D.moved=true;if(D.moved){stage.scrollLeft=D.sl-(e.clientX-D.x0);stage.scrollTop=D.st-(e.clientY-D.y0)}return}
  if(D.mode==='move'&&!D.live){if(Math.hypot(e.clientX-D.x0,e.clientY-D.y0)<=8)return;D.live=true}const pe=S.pageEls[D.pi];const p=toMM(e,pe.el);let dx=p.x-D.p0.x,dy=p.y-D.p0.y;
  if(D.mode==='create'||D.mode==='marquee'){const x=Math.min(p.x,D.p0.x),y=Math.min(p.y,D.p0.y);D.rect={x,y,w:Math.abs(dx),h:Math.abs(dy)};drawOverlay(D.pi);return}
  const it=findItem({page:D.pi,id:D.id});if(!it)return;const o=D.o;S.noSnap=e.altKey;
  const ex=new Set(D.mode==='move'?Object.keys(D.os):[D.id]),L=snapLines(D.pi,ex),G={pi:D.pi,xs:[],ys:[]};
  if(D.mode==='move'){
    if(e.shiftKey){if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0}
    const bb=bboxOf(Object.values(D.os));let nx=bb.x+dx,ny=bb.y+dy;
    if(!e.shiftKey||dx)nx+=snap1([nx,nx+bb.w/2,nx+bb.w],L.xs,G.xs);if(!e.shiftKey||dy)ny+=snap1([ny,ny+bb.h/2,ny+bb.h],L.ys,G.ys);
    const mx=nx-bb.x,my=ny-bb.y;for(const q of S.doc.pages[D.pi].items){const b0=D.os[q.id];if(b0){q.x=r1(b0.x+mx);q.y=r1(b0.y+my)}}
  }else{
    let x0=o.x,y0=o.y,x1=o.x+o.w,y1=o.y+o.h;const dd=D.dir;
    if(dd.includes('w')){x0+=dx;x0+=snap1([x0],L.xs,G.xs)}if(dd.includes('e')){x1+=dx;x1+=snap1([x1],L.xs,G.xs)}
    if(dd.includes('n')){y0+=dy;y0+=snap1([y0],L.ys,G.ys)}if(dd.includes('s')){y1+=dy;y1+=snap1([y1],L.ys,G.ys)}
    it.x=r1(Math.min(x0,x1-1));it.y=r1(Math.min(y0,y1-1));it.w=r1(Math.max(1,Math.abs(x1-x0)));it.h=r1(Math.max(1,Math.abs(y1-y0)));
  }
  S.snapG=G.xs.length||G.ys.length?G:null;dirty(D.pi);
});
/* 編集画面：動画の再生ボタンを押すとその場で再生（動かしたときは再生しない） */
document.addEventListener('pointerdown',e=>{if(inl&&!e.target.closest('.page'))stopInline()},true);
function playHit(it,p){if(!it||it.type!=='video'||!it.mediaId||!S.media[it.mediaId])return false;const r=Math.min(it.w,it.h)*0.14;return Math.hypot(p.x-(it.x+it.w/2),p.y-(it.y+it.h/2))<=r}
let inl=null;
function stopInline(){const I=inl;if(!I)return;inl=null;try{I.el.pause()}catch(e){}I.el.remove();if(I.url)URL.revokeObjectURL(I.url);if(I.el.wvDestroy)I.el.wvDestroy()}
function inlineTap(pi,id){const I=inl;if(I&&I.id===id&&I.el){const e=I.el,p=I.p;if(e.paused){if(p.end&&e.currentTime>=p.end-0.05)e.currentTime=p.st||0;e.play().catch(()=>{})}else e.pause();return}inlinePlay(pi,id)}
async function inlinePlay(pi,id){stopInline();const it=findItem({page:pi,id}),m=it&&S.media[it.mediaId];if(!m)return;
  const tok={id,p:it.play||{}};inl=tok;if(!m.blob)toast('動画を読み込んでいます…');let b;try{b=await mediaBlob(m)}catch(e){}if(inl!==tok)return;if(!b){inl=null;toast('動画を読み込めませんでした');return}
  const wc=!(await blobMediaUsable());if(inl!==tok)return;const pe=S.pageEls[pi];if(!pe){inl=null;return}
  const p=it.play||{},st=p.st||0,bl=S.doc.bleed,url=wc?null:URL.createObjectURL(b),el=wc?WV.attach(document.createElement('canvas'),b):document.createElement('video');
  if(!wc){el.playsInline=true;el.preload='auto';el.src=url}
  el.style.cssText=`position:absolute;z-index:3;left:${(it.x+bl)*S.s}px;top:${(it.y+bl)*S.s}px;width:${it.w*S.s}px;height:${it.h*S.s}px;object-fit:${it.fit==='stretch'?'fill':'contain'};background:#000;pointer-events:none`;el.className='inl';
  el.volume=p.vol==null?1:p.vol;el.muted=!!p.mute;Object.assign(tok,{el,url});
  el.addEventListener('loadedmetadata',()=>{if(st)el.currentTime=st;el.play().catch(()=>{})},{once:true});
  el.addEventListener('timeupdate',()=>{if(!el.isConnected){if(inl===tok)stopInline();else el.pause();return}if(p.end&&el.currentTime>=p.end){if(p.loop)el.currentTime=st;else stopInline()}});
  el.addEventListener('ended',()=>{if(p.loop){el.currentTime=st;el.play().catch(()=>{})}else if(inl===tok)stopInline()});
  el.addEventListener('error',()=>{toast(wc&&el.error&&el.error.message?el.error.message:'このブラウザでは再生できない形式です');if(inl===tok)stopInline()});
  pe.el.append(el)}
/* 画像・動画が未設定（×印）の枠をタップしたら、その枠に入れるファイルを選ぶ */
function emptyFrame(it){if(!it||it.locked)return false;if(it.type==='image'){const im=it.imageId&&S.images[it.imageId];return!im||!(im.img||im.pending)}return it.type==='video'&&!it.mediaId}
function fillEmpty(it){if(!emptyFrame(it))return false;if(it.type==='image')pickImage(it);else{vidTarget=it;$('#fVid').click()}return true}
function endDrag(e){
  const D=S.drag;if(!D)return;S.drag=null;if(D.mode==='pan'){if(!D.moved){select(D.tap?D.pi:null,D.tap);if(D.play)inlineTap(D.pi,D.play);else if(D.tap)fillEmpty(findItem({page:D.pi,id:D.tap}))}return}
  if(D.mode==='move'&&!D.grp&&!D.play&&e&&e.type==='pointerup'&&Math.hypot(e.clientX-D.x0,e.clientY-D.y0)<=4){const it=findItem({page:D.pi,id:D.id});if(emptyFrame(it)){Object.assign(it,{x:D.o.x,y:D.o.y});if(S.snapG){const g=S.snapG.pi;S.snapG=null;drawOverlay(g)}dirty(D.pi);fillEmpty(it);return}}
  if(S.snapG){const g=S.snapG.pi;S.snapG=null;drawOverlay(g)}
  if(D.mode==='marquee'){const r=D.rect;if(!r||r.w<1&&r.h<1){drawOverlay(D.pi);return}
    const hitIds=S.doc.pages[D.pi].items.filter(o=>o.x<r.x+r.w&&o.x+o.w>r.x&&o.y<r.y+r.h&&o.y+o.h>r.y).map(o=>o.id);
    const ids=[...D.base];for(const id of hitIds)if(!ids.includes(id))ids.push(id);if(ids.length)selectMany(D.pi,ids);else{select(null);drawOverlay(D.pi)}return}
  if(D.mode==='move'&&!D.live){if(D.grp)setKey(D.id);if(D.play)inlineTap(D.pi,D.play);return}
  if(D.mode==='move')stopInline();
  if(D.mode==='create'){
    let r=D.rect;if(!r||r.w<2||r.h<2){const W=S.tool==='text'?40:40;r={x:D.p0.x,y:D.p0.y,w:W,h:W}}
    r={x:r1(r.x),y:r1(r.y),w:r1(r.w),h:r1(r.h)};
    const mk=S.tool==='text'?textItem:S.tool==='image'?imageItem:S.tool==='video'?videoItem:rectItem;const it=mk(r);if(S.doc.kind==='slide')slideDefaults(it);
    if(S.tool==='rect'&&S.doc.color==='mono')it.fill={c:0,m:0,y:0,k:20};
    S.doc.pages[D.pi].items.push(it);setTool('select');select(D.pi,it.id);dirty(D.pi);commit();
    if(it.type==='text')setTimeout(()=>editText(D.pi,it),0);
    if(it.type==='image')pickImage(it);
    if(it.type==='video'){vidTarget=it;$('#fVid').click()}
    return;
  }
  commit();renderProps();
}

document.addEventListener('keydown',e=>{

function tocAuto(){const d=S.doc,out=[],skip=new Set(PLAN_KINDS.map(k=>k[1]));let prev='';

  if(out.length)return out;
  /* 台割にタイトルがない書類：太字か12pt以上の文字の1行目を見出しとみなす */
  d.pages.forEach(p=>{for(const it of p.items){if(it.type!=='text'||it.gen||!(it.weight>=700||it.size>=12))continue;const t=String(it.text||'').split('\n')[0].trim();if(t&&t.length<=40&&t!==d.name&&!out.some(o=>o.pid===p.id)){out.push({title:t,by:'',pid:p.id});break}}});
  return out}

function hpPlan(o){

  const fit=p=>{const[x,y]=orient(p);return cw<=x+0.6&&H<=y+0.6};
  let key=o.paper;
  if(key==='auto'){key=['A4','B5'].filter(fit).sort((a,b)=>PAPERS[a][0]*PAPERS[a][1]-PAPERS[b][0]*PAPERS[b][1])[0]||'A4'}
  const[pW,pH]=orient(key),fits=fit(key);
  const sc=o.scale==='fit'||!fits?Math.min(pW/cw,pH/H):1;
  const ox=(pW-cw*sc)/2,oy=(pH-H*sc)/2;

      sides.push({sheet:s,face:0,pages:R?[b,a]:[a,b]},{sheet:s,face:1,pages:R?[e,c]:[c,e]});
    }

  const rotBack=(o.duplex==='short'||o.duplex==='long'?o.duplex!==natural:false)!==!!o.flip;
  for(const sd of sides)sd.rot=sd.face===1&&rotBack;

}
function hpChecks(P){

}

function jpegPDF(pages,dup){

function ppPlan(o,mctx){

  const idx=d.pages.map((_,i)=>i).filter(i=>o.hidden||!d.pages[i].hidden);
  const fitBox=(x,y,w,h)=>{const s=Math.min(w/W,h/H),fw=W*s,fh=H*s;return{x:x+(w-fw)/2,y:y+(h-fh)/2,w:fw,h:fh}};

  const grid=(cols,rows,gap)=>{const cw=(bw-gap*(cols-1))/cols,ch=(bh-gap*(rows-1))/rows;
    for(let k=0;k<list.length;k+=cols*rows){const cells=[];for(let j=0;j<cols*rows&&k+j<list.length;j++){const c=j%cols,r=Math.floor(j/cols);cells.push({i:list[k+j],...fitBox(bx+c*(cw+gap),by+r*(ch+gap),cw,ch)})}pages.push({cells,notes:[]})}};

  else if(o.lay==='four')grid(2,2,8);
  else if(o.lay==='six')grid(2,3,8);
  else if(o.lay==='notes'){
    for(const i of list){
      const sh=Math.min(bh*0.45,bw*H/W),r=fitBox(bx,by,bw,sh),ny=r.y+r.h+8,lines=ppWrap(mctx,noteOf(i),font,FS,bw),per=Math.max(1,Math.floor((by+bh-ny)/(FS*LH)));
      pages.push({cells:[{i,...r}],notes:[{x:bx,y:ny,w:bw,fs:FS,lh:LH,font,lines:lines.slice(0,per)}]});
      let rest=lines.slice(per);const per2=Math.max(1,Math.floor(bh/(FS*LH)));
      while(rest.length){pages.push({cells:[],notes:[{x:bx,y:by,w:bw,fs:FS,lh:LH,font,lines:rest.slice(0,per2)}]});rest=rest.slice(per2)}

  }else if(o.lay==='three'){

        const per=Math.floor(rh/(fs*LH));if(lines.length>per){over.push(i+1);lines=lines.slice(0,per);if(per)lines[per-1]=lines[per-1].replace(/.$/u,'…')}
        notes.push({x:nx,y,w:nw,fs,lh:LH,font,lines})}
      pages.push({cells,notes})}
    if(over.length)warn.push(`ノートが入りきらないスライドがあります（${over.slice(0,8).join('、')}${over.length>8?` ほか${over.length-8}`:''}）。「1枚＋ノート」なら続きのページに印刷します`);
  }

function ppDrawPage(ctx,P,pg,o){
  const d=S.doc,W=pw(d),H=d.trimH;
  ctx.save();ctx.fillStyle='#ffffff';ctx.fillRect(0,0,P.pW,P.pH);
  for(const c of pg.cells){
    ctx.save();ctx.beginPath();ctx.rect(c.x,c.y,c.w,c.h);ctx.clip();ctx.translate(c.x,c.y);ctx.scale(c.w/W,c.h/H);
    drawPage(ctx,c.i,{preview:false,guides:false});ctx.restore();
    if(o.frame&&!pg.cover){ctx.strokeStyle='#000000';ctx.lineWidth=0.2;ctx.strokeRect(c.x,c.y,c.w,c.h)}
  }
  const K=100;ctx.fillStyle='#000000';ctx.textBaseline='middle';ctx.textAlign='left';
  for(const n of pg.notes){
    n.lines.forEach((l,j)=>{if(!l)return;ctx.save();ctx.translate(n.x,n.y+n.fs*n.lh*(j+0.5));ctx.scale(1/K,1/K);ctx.font=`400 ${n.fs*K}px ${FF(n.font)}`;ctx.fillText(l,0,0);ctx.restore()});
  }

async function ppRender(P,o,progress){

function tableItem(o){return Object.assign({id:uid(),type:'table',x:0,y:0,w:100,h:40,font:'Noto Sans JP',size:10,color:{c:0,m:0,y:0,k:100},line:{c:0,m:0,y:0,k:100},sw:0.2,link:null,tbl:{cells:[[{t:''}]],cw:[1],rh:[1]}},o)}
function tblGrid(it){const T=it.tbl,sw=T.cw.reduce((a,b)=>a+b,0)||1,sh=T.rh.reduce((a,b)=>a+b,0)||1,X=[it.x],Y=[it.y];
  for(const w of T.cw)X.push(X[X.length-1]+w/sw*it.w);for(const h of T.rh)Y.push(Y[Y.length-1]+h/sh*it.h);return{X,Y}}
function drawTable(ctx,it,ch,preview){
  const T=it.tbl;if(!T||!T.cells.length){return}
  const{X,Y}=tblGrid(it),fs=it.size*PT,pad=Math.min(1.5,fs*0.35),K=100;
  ctx.save();ctx.fillStyle=col(it.color,ch);ctx.textBaseline='middle';
  T.cells.forEach((row,r)=>row.forEach((c,k)=>{
    if(c.skip||!c.t)return;const x0=X[k],x1=X[Math.min(k+(c.cs||1),X.length-1)],y0=Y[r],y1=Y[Math.min(r+(c.rs||1),Y.length-1)],w8=c.b?700:400;
    needFont(it.font,w8,c.t);const ls=String(c.t).split('\n'),a=c.a;
    ctx.save();ctx.beginPath();ctx.rect(x0,y0,x1-x0,y1-y0);ctx.clip();
    ctx.translate(a==='r'?x1-pad:a==='c'?(x0+x1)/2:x0+pad,(y0+y1)/2-(ls.length-1)*fs*0.6);ctx.scale(1/K,1/K);
    ctx.font=`${w8} ${fs*K}px ${FF(it.font)}`;ctx.textAlign=a==='r'?'right':a==='c'?'center':'left';
    ls.forEach((l,j)=>ctx.fillText(l,0,j*fs*1.2*K));ctx.restore();
  }));
  if(it.line&&it.sw>0){ctx.strokeStyle=col(it.line,ch);ctx.lineWidth=it.sw;ctx.beginPath();
    T.cells.forEach((row,r)=>row.forEach((c,k)=>{if(c.skip)return;const x0=X[k],x1=X[Math.min(k+(c.cs||1),X.length-1)],y0=Y[r],y1=Y[Math.min(r+(c.rs||1),Y.length-1)];ctx.rect(x0,y0,x1-x0,y1-y0)}));ctx.stroke()}

function svPos(ev){
  if(!ev.items.length)return`<div class="sv-empty">頒布物が登録されていません</div><div class="sv-row"><button class="primary" data-tab="items">頒布物を登録</button></div>`;
  const sold=svSold(ev),total=svCartTotal(ev),paid=SV.paid,change=paid==null?null:paid-total;
  const lines=Object.entries(SV.cart).map(([i,q])=>{const it=ev.items.find(x=>x.id===i);if(!it)return'';
    return`<div class="sv-line"><span>${esc(it.name||'無題')}</span><span class="q"><button class="i" data-dec="${i}" title="減らす" aria-label="減らす">${IC.minus}</button><b class="num">${q}</b><button class="i" data-inc="${i}" title="増やす" aria-label="増やす">${IC.plus}</button></span><span class="num">${yen((+it.price||0)*q)}</span></div>`}).join('');
  return`<div class="sv-pos">
    <div class="sv-items">${ev.items.map(it=>{const l=svLeft(ev,it,sold),c=SV.cart[it.id]||0,rest=l==null?null:l-c;
      return`<button class="sv-it" data-inc="${it.id}"><b>${esc(it.name||'無題')}</b><span class="p">${yen(it.price)}</span>${rest==null?'':`<span class="r${rest<=0?' out':''}">残 ${rest}</span>`}${c?`<span class="c">×${c}</span>`:''}</button>`}).join('')}</div>
    <div class="sv-cart">
      ${lines||'<div class="sv-empty">未選択</div>'}
      <div class="sv-big"><span>合計</span><b>${yen(total)}</b></div>
      <div class="sv-cash"><button data-paid="exact">ちょうど</button><button data-paid="1000">1,000</button><button data-paid="5000">5,000</button><button data-paid="10000">10,000</button></div>
      <label class="f"><span>預かり</span><input type="number" id="sv-paid" inputmode="numeric" min="0" step="1" value="${paid==null?'':paid}"></label>
      <div class="sv-big"><span>お釣り</span><b id="sv-change" class="${change!=null&&change<0?'short':''}">${change==null?'—':change<0?'不足 '+yen(-change):yen(change)}</b></div>
      <div class="sv-row"><button data-act="clear">クリア</button><button class="primary grow" data-act="checkout"${total>0?'':' disabled'}>会計する</button></div>
    </div></div>`}

function svSum(ev){const sold=svSold(ev),total=ev.sales.reduce((a,s)=>a+s.total,0),qty=Object.values(sold).reduce((a,b)=>a+b,0);
  const names={};ev.items.forEach(it=>names[it.id]=it.name);
  const hist=[...ev.sales].reverse().map(s=>{const t=new Date(s.t);
    return`<span class="t">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</span><span class="x">${s.lines.map(l=>esc(names[l.i]||l.n)+(l.q>1?' ×'+l.q:'')).join('、')}</span><span class="a">${yen(s.total)}</span><button data-void="${s.id}">取消</button>`}).join('');
  return`<div class="sv-stats">
      <div><span>売上</span><b>${yen(total)}</b></div>
      <div><span>会計数</span><b>${ev.sales.length}</b></div>
      <div><span>頒布数</span><b>${qty}</b></div>
      <div><span>手元現金（釣り銭込み）</span><b>${yen(total+(+ev.float||0))}</b></div>
    </div>
    <table class="sv-tbl"><thead><tr><th>頒布物</th><th>単価</th><th>頒布</th><th>残</th><th>売上</th></tr></thead><tbody>
    ${ev.items.map(it=>{const l=svLeft(ev,it,sold),n=sold[it.id]||0;return`<tr><td>${esc(it.name||'無題')}</td><td>${yen(it.price)}</td><td>${n}</td><td class="${l!=null&&l<=0?'out':''}">${l==null?'—':l}</td><td>${yen(n*(+it.price||0))}</td></tr>`}).join('')}
    </tbody></table>
    <section class="sv-sec"><h3>履歴</h3>${hist?`<div class="sv-hist">${hist}</div>`:'<div class="sv-empty">なし</div>'}</section>
    <div class="sv-row"><button data-act="csv"${ev.sales.length?'':' disabled'}>CSV書き出し</button></div>`}

function svItems(ev){
  return`<section class="sv-sec">
    <div class="sv-edit"><h3>名前</h3><h3>価格</h3><h3>搬入数</h3><span></span></div>
    ${ev.items.map(it=>`<div class="sv-edit" data-item="${it.id}"><input type="text" data-f="name" value="${esc(it.name)}" aria-label="名前"><input type="number" class="num" data-f="price" inputmode="numeric" min="0" step="100" value="${it.price}" aria-label="価格"><input type="number" class="num" data-f="stock" inputmode="numeric" min="0" step="1" value="${it.stock??''}" aria-label="搬入数"><button data-delitem="${it.id}" aria-label="削除">削除</button></div>`).join('')}
    <div class="sv-row"><button data-act="additem">頒布物を追加</button></div></section>
    <label class="f sv-float"><span>釣り銭準備金</span><input type="number" class="num" id="sv-float" inputmode="numeric" min="0" step="1000" value="${ev.float||''}"></label>`}

function svMemo(ev){const others=SV.data.events.filter(e=>e!==ev&&(e.memo||'').trim()).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return`<textarea id="sv-memo" aria-label="反省メモ">${esc(ev.memo||'')}</textarea>
    ${others.length?`<section class="sv-sec"><h3>過去のイベント</h3>${others.map(e=>`<div class="sv-memo"><b>${svYMD(e.date)}　${esc(e.name||'無題のイベント')}</b><p>${esc(e.memo)}</p></div>`).join('')}</section>`:''}`}

function svInfo(ev){const F2=(lab,k,type,wide)=>`<label class="f${wide?' wide':''}"><span>${lab}</span><input type="${type}" data-ef="${k}" value="${esc(ev[k]||'')}"></label>`;
  return`<div class="sv-form">${F2('イベント名','name','text',true)}${F2('開催日','date','date')}${F2('スペース','space','text')}${F2('会場','venue','text',true)}${F2('申込締切','applyDue','date')}${F2('入稿締切','submitDue','date')}</div>
    <div class="sv-row"><button data-act="delev" class="danger">イベントを削除</button></div>`}

function svAddEvent(){const{up,past}=svSorted();const prev=past[0]||up[up.length-1];
  const ev={id:uid(),name:'',date:'',venue:'',space:'',applyDue:'',submitDue:'',float:prev?prev.float||0:0,
    items:prev?prev.items.map(it=>({id:uid(),name:it.name,price:it.price,stock:it.stock})):[],sales:[],memo:''};
  SV.data.events.push(ev);SV.ev=ev.id;SV.tab='info';SV.cart={};SV.paid=null;svSave();svRender();
  const n=$('#sv [data-ef="name"]');if(n)n.focus()}
function svCheckout(ev){const total=svCartTotal(ev);if(!(total>0))return;
  if(SV.paid!=null&&SV.paid<total){toast('預かり金額が不足しています');return}
  const lines=Object.entries(SV.cart).map(([i,q])=>{const it=ev.items.find(x=>x.id===i);return it?{i,n:it.name,q,p:+it.price||0}:null}).filter(Boolean);
  ev.sales.push({id:uid(),t:Date.now(),lines,total,paid:SV.paid==null?total:SV.paid});
  const ch=SV.paid==null?0:SV.paid-total;SV.cart={};SV.paid=null;svSave(true);svRender();toast(`${yen(total)} 会計しました`+(ch>0?`（お釣り ${yen(ch)}）`:''))}
function svCSV(ev){const q=v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['日時','頒布物','単価','数量','小計','会計合計','預かり']];
  for(const s of ev.sales){const t=new Date(s.t),ts=`${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    s.lines.forEach((l,k)=>rows.push([ts,l.n,l.p,l.q,l.p*l.q,k?'':s.total,k?'':s.paid]))}
  saveFile(`${ev.name||'イベント'}_${ev.date||''}_売上.csv`,new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}))}

$('#bSales').onclick=svOpen;
$('#sv').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ev=svCur(),d=b.dataset;
  if(d.ev){SV.ev=d.ev;SV.tab='pos';SV.cart={};SV.paid=null;svRender();return}
  if(d.tab){SV.tab=d.tab;svRender();return}
  if(d.inc){SV.cart[d.inc]=(SV.cart[d.inc]||0)+1;svRender();return}
  if(d.dec){if(--SV.cart[d.dec]<=0)delete SV.cart[d.dec];svRender();return}
  if(d.paid){SV.paid=d.paid==='exact'?svCartTotal(ev):+d.paid;svRender();return}
  if(d.void){const s=ev.sales.find(x=>x.id===d.void);if(s&&confirm(`${yen(s.total)} の会計を取り消しますか？`)){ev.sales=ev.sales.filter(x=>x!==s);svSave(true);svRender()}return}
  if(d.delitem){const it=ev.items.find(x=>x.id===d.delitem);if(it&&(!(svSold(ev)[it.id])||confirm('販売記録のある頒布物です。削除すると集計から外れます。削除しますか？'))){ev.items=ev.items.filter(x=>x!==it);delete SV.cart[it.id];svSave();svRender()}return}
  switch(d.act){
    case'close':svClose();break;
    case'home':SV.ev=null;svSave(true);svRender();break;
    case'add':svAddEvent();break;
    case'clear':SV.cart={};SV.paid=null;svRender();break;
    case'checkout':svCheckout(ev);break;
    case'csv':svCSV(ev);break;
    case'additem':ev.items.push({id:uid(),name:'',price:500,stock:''});svSave();svRender();{const r=$$('#sv .sv-edit[data-item] input[data-f="name"]');r[r.length-1]?.focus()}break;
    case'delev':if(confirm(`「${ev.name||'無題のイベント'}」を削除しますか？販売記録も削除されます。`)){SV.data.events=SV.data.events.filter(x=>x!==ev);SV.ev=null;svSave(true);svRender()}break;
    case'backup':saveFile(`honhon_イベント_${svToday()}.json`,new Blob([JSON.stringify({app:'honhon-sales',version:1,...SV.data})],{type:'application/json'}));break;
    case'restore':$('#fSales').click();break;
  }});
$('#sv').addEventListener('input',e=>{const t=e.target,ev=svCur();if(!ev)return;
  if(t.id==='sv-paid'){SV.paid=t.value===''?null:+t.value;const total=svCartTotal(ev),c=SV.paid==null?null:SV.paid-total,o=$('#sv-change');
    o.textContent=c==null?'—':c<0?'不足 '+yen(-c):yen(c);o.classList.toggle('short',c!=null&&c<0);return}
  if(t.id==='sv-memo'){ev.memo=t.value;svSave();return}
  if(t.id==='sv-float'){ev.float=t.value===''?0:+t.value;svSave();return}
  if(t.dataset.ef){ev[t.dataset.ef]=t.value;svSave();if(t.dataset.ef==='name')$('#sv .svh h2').textContent=t.value||'無題のイベント';return}
  const row=t.closest('[data-item]');if(row&&t.dataset.f){const it=ev.items.find(x=>x.id===row.dataset.item);if(!it)return;
    it[t.dataset.f]=t.dataset.f==='name'?t.value:t.value===''?(t.dataset.f==='stock'?'':0):+t.value;svSave()}});
$('#sv').addEventListener('change',e=>{if(e.target.dataset.ef==='date')svRender()});
$('#fSales').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(!['honhon-sales','thinbook-sales'].includes(j.app)||!Array.isArray(j.events))throw new Error('イベントのバックアップファイルではありません');
    const have=new Set(SV.data.events.map(x=>x.id));let n=0;for(const ev of j.events)if(!have.has(ev.id)){SV.data.events.push(ev);n++}
    svSave(true);svRender();toast(n+'件のイベントを読み込みました')}catch(err){toast(err.message||'読み込めませんでした')}});
window.addEventListener('keydown',e=>{if($('#sv').hidden)return;e.stopPropagation();
  if(e.key==='Escape'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){if(SV.ev){SV.ev=null;svRender()}else svClose()}},true);
kvGet('sales').then(v=>{if(v&&Array.isArray(v.events)&&!SV.data.events.length)SV.data=v;SV.loaded=true});

/* ---------- neta (idea notes) ---------- */
const N8={list:[],cur:null,q:'',tag:'',open:false,t:0};
const netaEl=$('#neta');
function netaSave(){clearTimeout(N8.t);N8.t=setTimeout(()=>kvSet('neta',N8.list),400)}
function netaTags(s){return[...new Set(String(s).split(/[,、，\s]+/).map(x=>x.replace(/^#/,'').trim()).filter(Boolean))]}
function netaDate(t){const d=new Date(t);return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}
function netaCur(){return N8.list.find(n=>n.id===N8.cur)||null}
function netaNew(){const t=Date.now(),n={id:uid(),title:'',body:'',tags:N8.tag?[N8.tag]:[],images:[],created:t,updated:t};N8.list.unshift(n);N8.cur=n.id;N8.q='';$('#nQ').value='';netaSave();netaRenderList();netaRenderEdit();$('#nTitle').focus()}
function netaTouch(n){n.updated=Date.now();N8.list.sort((a,b)=>b.updated-a.updated);netaSave()}
function netaMatch(n){if(N8.tag&&!n.tags.includes(N8.tag))return false;if(!N8.q)return true;const q=N8.q.toLowerCase();return(n.title+'\n'+n.body+'\n'+n.tags.join(' ')).toLowerCase().includes(q)}
function netaRenderList(){
  const all=[...new Set(N8.list.flatMap(n=>n.tags))].sort((a,b)=>a.localeCompare(b,'ja'));if(N8.tag&&!all.includes(N8.tag))N8.tag='';
  $('#nTagF').innerHTML=all.map(t=>`<button data-tag="${esc(t)}" class="${t===N8.tag?'on':''}">${esc(t)}</button>`).join('');
  const vis=N8.list.filter(netaMatch);
  $('#nItems').innerHTML=vis.length?vis.map(n=>`<button class="nit${n.id===N8.cur?' cur':''}" data-id="${n.id}"><b>${esc(n.title||'無題')}</b><small>${netaDate(n.updated)}${n.images.length?' ・ 画像'+n.images.length:''}</small>${n.tags.length?`<span class="ntags">${n.tags.map(t=>`<span class="ntag">${esc(t)}</span>`).join('')}</span>`:''}</button>`).join(''):`<div class="nempty">${N8.list.length?'該当なし':'ネタがありません'}</div>`;
}
function netaRenderEdit(){
  const n=netaCur(),el=$('#nEdit');
  netaEl.classList.toggle('empty',!n);
  if(!n){el.innerHTML=`<div class="nempty"><button class="primary" id="nAdd2">ネタを追加</button></div>`;$('#nAdd2').onclick=netaNew;return}
  el.innerHTML=`<input type="text" id="nTitle" value="${esc(n.title)}" placeholder="タイトル" aria-label="タイトル">
    ${F('タグ',`<input type="text" id="nTagIn" value="${esc(n.tags.join(', '))}" placeholder="カンマ区切り">`)}
    <textarea id="nBody" spellcheck="false" aria-label="本文">${esc(n.body)}</textarea>
    <div class="sec"><h3>画像</h3><div class="nimgs" id="nImgs">${n.images.map((im,k)=>`<div class="nimg"><img src="${im.src}" alt="${esc(im.name||'')}"><button class="i" data-rm="${k}" title="画像を削除" aria-label="画像を削除">${IC.x}</button></div>`).join('')}<button id="nImgAdd" class="nimg" title="画像を追加" aria-label="画像を追加">${IC.plus}</button></div></div>
    <div class="nact"><button id="nDel" class="danger">削除</button><button class="primary" id="nBook">このネタで新規書類</button></div>`;
  $('#nTitle').oninput=e=>{n.title=e.target.value;netaTouch(n);netaRenderList()};
  $('#nBody').oninput=e=>{n.body=e.target.value;netaTouch(n)};
  $('#nTagIn').onchange=e=>{n.tags=netaTags(e.target.value);e.target.value=n.tags.join(', ');netaTouch(n);netaRenderList()};
  $('#nImgAdd').onclick=()=>$('#fNetaImg').click();
  $('#nImgs').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;n.images.splice(+b.dataset.rm,1);netaTouch(n);netaRenderEdit();netaRenderList()};
  $('#nDel').onclick=()=>{const d=modal(`<h2>「${esc(n.title||'無題')}」を削除しますか？</h2><div class="foot"><button id="nd-c">キャンセル</button><button class="primary" id="nd-ok">削除</button></div>`);
    $('#nd-c').onclick=closeModal;$('#nd-ok').onclick=()=>{N8.list=N8.list.filter(x=>x!==n);N8.cur=(N8.list.find(netaMatch)||{}).id||null;netaSave();closeModal();netaRenderList();netaRenderEdit()}};
  $('#nBook').onclick=()=>netaToBook(n);
}
async function netaAddImages(files){const n=netaCur();if(!n)return;
  for(const f of files){if(!f.type.startsWith('image/'))continue;try{const im=await readImage(f);n.images.push({id:uid(),src:im.src,w:im.w,h:im.h,name:im.name||''})}catch(e){toast(e.message)}}
  netaTouch(n);netaRenderEdit();netaRenderList()}
function netaToBook(n){
  $('#bNew').onclick();const ok=$('#n-ok'),orig=ok.onclick;
  ok.onclick=async()=>{orig();if(!$('#modal').hidden)return;
    const d=S.doc;d.name=n.title||'無題';
    if(d.kind!=='cover'){
      if(n.body.trim()){const m=margBox(0);d.pages[0].items.push(textItem({x:m.x,y:m.y,w:m.w,h:m.h,text:n.body}))}
      let pi=n.body.trim()?1:0;
      for(const im of n.images){
        while(pi>=d.pages.length)d.pages.push({id:uid(),items:[],noNombre:false});
        const img=new Image();await new Promise(r=>{img.onload=img.onerror=r;img.src=im.src});
        const id=uid();S.images[id]={src:im.src,w:im.w,h:im.h,name:im.name,img};
        const m=margBox(pi);d.pages[pi].items.push(imageItem({x:r1(m.x),y:r1(m.y),w:r1(m.w),h:r1(m.h),fit:'contain',imageId:id}));pi++;
      }
    }
    netaShow(false);fitZoom();rebuild();renderAll();resetHistory();toast('ネタから書類を作成しました');
  };
}
function netaShow(on){N8.open=on;$('#app').classList.toggle('neta-on',on);netaEl.hidden=!on;if(!on&&document.activeElement&&netaEl.contains(document.activeElement))$('#mApp .mb').focus();
  if(on){if(!netaCur())N8.cur=(N8.list[0]||{}).id||null;netaRenderList();netaRenderEdit()}else{dirtyAll()}}
$('#bNeta').onclick=()=>netaShow(true);$('#nBack').onclick=()=>netaShow(false);
$('#nAdd').onclick=netaNew;
$('#nQ').oninput=e=>{N8.q=e.target.value.trim();netaRenderList()};
$('#nTagF').onclick=e=>{const b=e.target.closest('[data-tag]');if(!b)return;N8.tag=N8.tag===b.dataset.tag?'':b.dataset.tag;netaRenderList()};
$('#nItems').onclick=e=>{const b=e.target.closest('.nit');if(!b)return;N8.cur=b.dataset.id;netaRenderList();netaRenderEdit()};
$('#fNetaImg').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';netaAddImages(fs)});
$('#nEdit').addEventListener('dragover',e=>{if(!netaCur())return;e.preventDefault();const g=$('#nImgs');if(g)g.classList.add('drop')});
$('#nEdit').addEventListener('dragleave',e=>{if(!e.currentTarget.contains(e.relatedTarget)){const g=$('#nImgs');if(g)g.classList.remove('drop')}});
$('#nEdit').addEventListener('drop',e=>{e.preventDefault();const g=$('#nImgs');if(g)g.classList.remove('drop');netaAddImages([...e.dataTransfer.files])});
$('#nEdit').addEventListener('paste',e=>{const fs=[...(e.clipboardData&&e.clipboardData.files)||[]].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();netaAddImages(fs)}});
document.addEventListener('keydown',e=>{if(N8.open){if(e.key==='Escape'&&!$('#modal').hidden)return;e.stopImmediatePropagation()}},true);
$('#nExp').onclick=()=>saveFile('ネタ帳.honhon-neta.json',new Blob([JSON.stringify({app:'honhon-neta',version:1,notes:N8.list})],{type:'application/json'}));
$('#nImp').onclick=()=>$('#fNeta').click();
$('#fNeta').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const p=JSON.parse(await f.text());if(!p||!['honhon-neta','thinbook-neta'].includes(p.app)||!Array.isArray(p.notes))throw new Error('ネタ帳のファイルではありません');
    const have=new Set(N8.list.map(n=>n.id));let k=0;for(const n of p.notes){if(!n||!n.id||have.has(n.id))continue;N8.list.push({title:'',body:'',tags:[],images:[],created:Date.now(),updated:Date.now(),...n});k++}
    N8.list.sort((a,b)=>b.updated-a.updated);netaSave();netaRenderList();netaRenderEdit();toast(k+'件読み込みました')}
  catch(err){toast(err.message||'読み込めませんでした')}});
kvGet('neta').then(v=>{if(Array.isArray(v))N8.list=v;if(N8.open){netaRenderList();netaRenderEdit()}});

/* ---------- 台割（page.plan = {kind,title,note}） ---------- */
const KIND_LABEL=Object.fromEntries(PLAN_KINDS);
const KIND_ALIAS={'本文':'body','漫画':'body','マンガ':'body','小説':'body','扉':'title','中扉':'title','目次':'toc','もくじ':'toc','イラスト':'illust','挿絵':'illust','口絵':'illust','奥付':'colophon','白':'blank','空白':'blank','その他':'other'};
function kindOf(s){s=String(s||'').trim();if(!s)return'body';if(KIND_LABEL[s])return s;if(KIND_ALIAS[s])return KIND_ALIAS[s];for(const[k,v]of Object.entries(KIND_ALIAS))if(s.includes(k))return v;return'other'}
const DW={rows:null,doc:null,dirty:false,sel:new Set(),anchor:null,cur:null,blobs:[],urls:[],busy:false,bookTitle:'',drag:null,confirm:false};
let smpCap=null;try{if(window.claude&&window.claude.use)smpCap=window.claude.use('sample')}catch(e){}

function touch(){DW.dirty=true;DW.confirm=false;$('#dw-apply').textContent='冊子に反映'}

function setSel(s){DW.sel=s;$$('#dw-tb tr').forEach((tr,i)=>tr.classList.toggle('sel',s.has(i)))}

function cell(i,c){return $(`#dw-tb tr[data-i="${i}"] input[data-c="${c}"]`)}
function updCount(){const n=DW.rows.length,c=$('#dw-cnt');$('#dw-n').value=n;c.textContent=n%4?'4の倍数ではありません':'';c.classList.toggle('warn',n%4!==0)}
function renderDW(focus){
  const tb=$('#dw-tb');if(!tb)return;const st=S.doc.nombre.start;
  tb.innerHTML=DW.rows.map((r,i)=>`<tr data-i="${i}" class="${rowCls(i)}"><th draggable="true">${st+i}</th><td><input data-c="0" list="dw-kinds" value="${esc(KIND_LABEL[r.kind])}" aria-label="種類"></td><td><input data-c="1" value="${esc(r.title)}" aria-label="タイトル"></td><td><input data-c="2" value="${esc(r.note)}" aria-label="メモ"></td></tr>`).join('');

}
function moveRows(dir){const s=selRows();if(!s.length)return;if(dir<0&&s[0]===0||dir>0&&s[s.length-1]===DW.rows.length-1)return;
  const order=dir<0?s:[...s].reverse();for(const i of order){const t=DW.rows[i];DW.rows[i]=DW.rows[i+dir];DW.rows[i+dir]=t}
  DW.sel=new Set(s.map(i=>i+dir));if(DW.cur!=null)DW.cur+=dir;touch();const a=document.activeElement,c=a&&a.dataset?a.dataset.c:null;renderDW(c!=null&&DW.cur!=null?[DW.cur,+c]:null)}
function onCellKey(e){
  const inp=e.target;if(inp.tagName!=='INPUT')return;const i=rowOf(inp),c=+inp.dataset.c,mod=e.ctrlKey||e.metaKey;
  const go=(r,cc)=>{const el=cell(clamp(r,0,DW.rows.length-1),clamp(cc,0,2));if(el){e.preventDefault();el.focus();el.select()}};
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();moveRows(e.key==='ArrowUp'?-1:1);return}
  if(e.key==='ArrowUp'&&!e.shiftKey)return go(i-1,c);
  if(e.key==='ArrowDown'&&!e.shiftKey){if(c===0&&e.altKey)return;return go(i+1,c)}

  if(e.key==='ArrowRight'&&inp.selectionStart===inp.value.length)return go(i,c+1);

function onPaste(e){

  if(c0===0&&lines[0].length>=2&&lines.every(l=>/^\s*(p\.?\s*)?\d*\s*$/i.test(l[0])))lines=lines.map(l=>l.slice(1));
  lines.forEach((l,k)=>{const i=r0+k;while(DW.rows.length<=i)DW.rows.push(blankRow());const r=DW.rows[i];
    l.forEach((v,j)=>{const c=c0+j;if(c===0)r.kind=kindOf(v);else if(c===1)r.title=v.trim();else if(c===2)r.note=v.trim()})});
  touch();renderDW([r0,c0]);
}

async function shrinkImage(f){const bmp=await createImageBitmap(f);const k=Math.min(1,1568/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');
  c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);

const DW_PROMPT=`画像は冊子（同人誌など）の台割ラフで、紙に手書きされたものです。画像が複数ある場合は続きのページとしてまとめて1つのJSONにしてください。各ページの内容を読み取り、次の形式のJSONだけを返してください。
{"bookTitle": string|null, "total": number|null, "pages": [{"from": number, "to": number, "kind": "body"|"title"|"toc"|"illust"|"colophon"|"blank"|"other", "title": string, "note": string}]}
例: {"bookTitle":"夏の本","total":24,"pages":[{"from":1,"to":1,"kind":"title","title":"夏の本","note":""},{"from":2,"to":2,"kind":"toc","title":"","note":""},{"from":3,"to":12,"kind":"body","title":"第一話","note":""}]}
- from/to は本文のページ番号（1始まり、範囲の両端を含む）。表紙（表1〜表4）は含めない。
- kind: body=本文・漫画・小説、title=扉・中扉、toc=目次、illust=イラスト・口絵、colophon=奥付、blank=白・空白ページ、other=広告・あとがき・その他。
- title はそのページに書かれた作品名・章題・見出し。なければ空文字。
- note はそれ以外の書き込み（カラー、ゲスト名、見開き など）。なければ空文字。
- total は総ページ数。書かれていなければ最後のページ番号。
- ページ番号がない場合は、枠の並び順（右綴じなら右から左、上から下）で数える。
- 読めない文字は推測せず、読めた部分だけを入れる。
専用記入用紙（上部に「HonHon 台割」と印字、四隅に黒い四角、ページごとの枠）の場合:
- 各枠の左上の太字の数字が印字済みのページ番号。これをそのまま from/to に使う。
- 種類は枠内のチェックボックス（本文・扉・目次・イラスト・奥付・白）のうち、レ点・×・塗りつぶし・丸囲みのあるもの。何も印がなく、タイトルもメモも空なら、その枠は出力しない。
- 「タイトル」欄の手書きを title、「メモ」欄の手書きを note にする。「〃」「同上」や前の枠から続く矢印・線は、前のページと同じ種類・タイトルを意味する。
- 用紙上部の「書名」欄を bookTitle、「総ページ数」欄を total にする。`;
function apiKey(){if(DW.key)return DW.key;try{return localStorage.getItem('thinbook.apikey')||''}catch(e){return''}}
async function callApi(key,blobs){
  const b64s=await Promise.all(blobs.map(blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})));
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:8000,messages:[{role:'user',content:[...b64s.map(data=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data}})),{type:'text',text:DW_PROMPT}]}]})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401){try{localStorage.removeItem('thinbook.apikey')}catch(e){}DW.key=''}throw new Error((j.error&&j.error.message)||'HTTP '+r.status)}
  const t=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('結果を読み取れませんでした');return JSON.parse(m[0]);
}
async function analyzeRough(){
  if(!(DW.blobs&&DW.blobs.length)||DW.busy)return;
  const btns=['#dw-load','#dw-re','#dw-apply'];const busy=v=>{DW.busy=v;btns.forEach(s=>{const b=$(s);if(b)b.disabled=v})};
  busy(true);setMsg('解析中…');
  try{
    const smp=smpCap&&await smpCap;const lim=smp?await smp.limits().catch(()=>null):null;let out;
    if(lim&&lim.images){const mx=lim.images.maxCount||DW.blobs.length;out=await smp.json(DW_PROMPT,{images:DW.blobs.slice(0,mx),modelTier:'default'})}
    else{const k=apiKey();if(!k){setMsg('');$('#dw-key').hidden=false;$('#dw-keyv').focus();return}out=await callApi(k,DW.blobs)}
    fillFromRough(out);setMsg('');toast('ラフを読み込みました（'+DW.rows.length+'ページ）');
  }catch(e){
    if(e&&e.code==='not_granted')setMsg('画像の解析が許可されていません',true);
    else if(e&&e.code==='rate_limited')setMsg('混み合っています。しばらくしてから再解析してください',true);
    else setMsg('解析できませんでした：'+((e&&(e.message||e.code))||e),true);
  }finally{busy(false)}
}
function fillFromRough(o){
  const ps=o&&Array.isArray(o.pages)?o.pages:[];let max=0;
  for(const p of ps){const f=parseInt(p.from),t=parseInt(p.to);if(f>0)max=Math.max(max,t>=f?t:f)}
  const total=Math.min(1000,Math.max(parseInt(o&&o.total)||0,max));if(!total)throw new Error('ページを読み取れませんでした');
  const prev=DW.rows||[];const rows=Array.from({length:total},(_,i)=>({...blankRow(),pid:prev[i]?prev[i].pid:null}));
  for(const p of ps){const f=parseInt(p.from);if(!(f>0))continue;const t=Math.max(f,parseInt(p.to)||f);
    for(let i=f;i<=Math.min(t,total);i++)Object.assign(rows[i-1],{kind:kindOf(p.kind),title:String(p.title||'').trim(),note:String(p.note||'').trim()})}
  DW.rows=rows;DW.bookTitle=o&&o.bookTitle?String(o.bookTitle).trim():'';DW.sel.clear();DW.cur=null;touch();renderDW();
}

function applyDaiwari(){
  const d=S.doc,old=new Map(d.pages.map(p=>[p.id,p])),seen=new Set();
  for(const r of DW.rows){if(r.pid&&seen.has(r.pid))r.pid=null;if(r.pid)seen.add(r.pid)}
  const lost=d.pages.filter(p=>!seen.has(p.id)&&p.items.length).length;
  if(lost&&!DW.confirm){DW.confirm=true;setMsg(`内容のある${lost}ページが削除されます`,true);$('#dw-apply').textContent='削除して反映';return}
  const gen=[];
  d.pages=DW.rows.map((r,i)=>{let p=r.pid&&old.get(r.pid);const prev=p&&p.plan;if(!p)p={id:uid(),items:[],noNombre:false};
    if(!p.items.length&&(!prev||prev.kind!==r.kind||prev.title!==r.title))gen.push(i);
    p.plan={kind:r.kind,title:r.title,note:r.note};return p});
  if(DW.bookTitle&&(!d.name||d.name==='無題'))d.name=DW.bookTitle;
  for(const i of gen)scaffold(i);
  DW.rows=null;DW.dirty=false;DW.confirm=false;S.sel=null;S.page=Math.min(S.page,d.pages.length-1);
  closeModal();rebuild();commit();renderAll();toast(`台割を反映しました（${d.pages.length}ページ）`);
}
function tocLines(){const d=S.doc,out=[];let prev='';

  else if(k==='colophon'){add(textItem({gen:'scaffold-colophon',x:m.x,y:r1(m.y+m.h-40),w:m.w,h:40,text:[d.name||'','','発行日　','発行　','印刷　'].join('\n'),font:'Noto Sans JP',size:8,leading:170,dir:'h'}))}

const SHEET_KINDS=[['本文','扉','目次'],['イラスト','奥付','白']];

  if(lvl===3)return `<span class="hid blk" data-rv>${esc(text).replace(/\n/g,'<br>')}</span>`;
  let k=0,h='';
  for(const s of words(text,lang)){

/* 既存の名刺データ。PDFは実寸から仕上がりサイズを推定（仕上がりを中央に置き、塗り足し・トンボの外側は切る）。画像は縦横比から推定 */
let pdfjsP=null;
function loadPdfjs(){const V='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';return pdfjsP||(pdfjsP=new Promise((res,rej)=>{if(window.pdfjsLib){res(window.pdfjsLib);return}const s=document.createElement('script');s.src=V+'pdf.min.js';
  s.onload=()=>{const L=window.pdfjsLib;if(!L){rej(new Error('PDFを開く部品を読み込めませんでした'));return}L.GlobalWorkerOptions.workerSrc=V+'pdf.worker.min.js';res(L)};s.onerror=()=>{pdfjsP=null;rej(new Error('PDFを開く部品を読み込めませんでした（ネットワーク）'))};document.head.append(s)}))}
function cardFitMm(w,h,Z=CARD_SIZES){let best=null;for(const z of Z)for(const [W,H] of [[z[2],z[3]],[z[3],z[2]]]){const ex=(w-W)/2,ey=(h-H)/2;if(ex<-0.6||ey<-0.6)continue;const sc=Math.abs(ex-ey)*4+Math.min(ex,ey)*0.1;if(Math.abs(ex-ey)<1.2&&(!best||sc<best.sc))best={W,H,ext:Math.max(0,Math.min(ex,ey)),sc}}return best}
function cardFitPx(w,h,Z=CARD_SIZES){const r=w/h;let best=null;for(const z of Z)for(const [W,H] of [[z[2],z[3]],[z[3],z[2]]])for(const e of[0,3]){const df=Math.abs(Math.log(r/((W+2*e)/(H+2*e))));if(!best||df<best.df)best={W,H,ext:e,df}}return best}
async function cardImport(files,Z=CARD_SIZES){const faces=[],images={};
  for(const f of files){if(faces.length>=2)break;const head=new Uint8Array(await f.slice(0,5).arrayBuffer());
    if(String.fromCharCode(...head)==='%PDF-'){const L=await loadPdfjs(),pdf=await L.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
      for(let n=1;n<=pdf.numPages&&faces.length<2;n++){const p=await pdf.getPage(n),vp1=p.getViewport({scale:1}),wmm=vp1.width*PT,hmm=vp1.height*PT,k=600/72,vp=p.getViewport({scale:k});
        const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);
        await p.render({canvasContext:x,viewport:vp}).promise;const src=c.toDataURL('image/png'),img=await loadImg(src),id=uid();images[id]={src,w:c.width,h:c.height,img,name:f.name+(pdf.numPages>1?' p'+n:'')};
        faces.push({id,wmm,hmm,fit:cardFitMm(wmm,hmm,Z),pdf:true})}}
    else if(/^\x89PNG|^\xff\xd8|^8BPS/.test(String.fromCharCode(...head))||/^image\//.test(f.type)){const im=await readImage(f),id=uid();images[id]=im;faces.push({id,fit:cardFitPx(im.w,im.h,Z)})}
    else if(/^%!/.test(String.fromCharCode(...head)))throw new Error('このAIファイルは読み込めません。PDF互換ファイルを作成するをオンにして保存し直してください');
    else throw new Error('読み込めない形式です：'+f.name)}
  if(!faces.length)throw new Error('ページがありません');
  const f0=faces[0].fit||cardFitPx(faces[0].wmm,faces[0].hmm,Z);return{faces,images,W:f0.W,H:f0.H}}
function cardImpLabel(m,what='名刺'){const f=m.faces[0],e=f.fit?f.fit.ext:0,sz=[m.W+'×'+m.H+'mm',m.faces.length>1?'表・裏':'表のみ'];
  if(f.pdf&&!f.fit)sz.push(what+'のサイズではないため中央を合わせて配置');else if(e>3.5)sz.push('トンボを除いて配置');else if(e>=2.5)sz.push('塗り足しあり');else sz.push('塗り足しなし');return sz.join(' ・ ')}
function cardImpDoc(m,base=cardDocBase){const d=base(m.W,m.H),b=d.bleed;d.name=(m.images[m.faces[0].id].name||(d.kind==='dm'?'DM':'名刺')).replace(/\.[^.]+$/,'').replace(/ p\d+$/,'');

    if(f.pdf)it=imageItem({x:(m.W-f.wmm)/2,y:(m.H-f.hmm)/2,w:f.wmm,h:f.hmm,imageId:f.id,fit:'stretch'});
    else{const e=f.fit&&f.fit.W===m.W&&f.fit.H===m.H?f.fit.ext:Math.min(b,3);it=imageItem({x:-e,y:-e,w:m.W+2*e,h:m.H+2*e,imageId:f.id,fit:'cover'})}
    pg.items.push(it);return pg});return d}

const DM_SIZES=[['hagaki','はがき（100×148mm）',100,148],['a6','A6（105×148mm）',105,148],['a5','A5（148×210mm）',148,210],['a4','A4（210×297mm）',210,297]];

/* 文字の高さ（mm）を行数から見積もる。全角1・半角0.55 */
function dmLines(t,size,track,w){let n=0;for(const ln of String(t).split('\n')){let u=0;for(const ch of ln)u+=ch.charCodeAt(0)<0x2000?0.55:1;n+=Math.max(1,Math.ceil(u*size*PT*(1+(track||0)/1000)/Math.max(1,w)-0.02))}return n}
/* 文字幅を実測し、各行が折り返さない大きさに縮める（min より小さくはしない） */
let dmMc=null;
function dmFit(t,wmm,max,min,weight,track){dmMc=dmMc||document.createElement('canvas').getContext('2d');dmMc.font=`${weight||400} 100px "Noto Sans JP"`;

  if(!u)return max;return Math.max(min,Math.min(max,Math.floor(wmm*0.97/(u*PT)*2)/2))}
function dmText(t,b,y,size,o={}){const lead=o.leading||150,n=dmLines(t,size,o.track,b.w),h=(size*PT)*(1+(n-1)*lead/100)+size*PT*0.3;

function dmStack(b,f,o,s){const v=k=>(f[k]||'').trim()||DM_PH[k],al=o.align||'start',c=o.c||'ink',ac=o.ac||'accent',sc=o.sc||'sub',out=[];let y=b.y;

  const MINPT={title:12,name:8,date:9,place:8,detail:8,from:8};

  for(const k of o.keys){if(k==='bar'){out.push(cardRect({x:al==='center'?b.x+b.w/2-5*s:b.x,y,w:10*s,h:0.7*s,fillRole:o.bar||ac}));y+=0.7*s+gap.bar*s;continue}

function dmScale(W,H){return Math.min(W,H)/100}
function dmFront(lay,W,H,b,f,full){const s=dmScale(W,H),M=8*s,P=H>W,pg={id:uid(),items:[],noNombre:true,bgRole:'bg'},it=pg.items,info=full?['date','place','detail']:['date','place'];

/* 一覧ページから記事へのリンクを拾う：同じ構造で並んだリンクの一番大きな集まり */
