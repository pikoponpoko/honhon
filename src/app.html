  --accent:#5B8CFF; --accent-hover:#5B8CFF; --accent-active:#E6EEE9; --accent-soft:#1F2B29; --accent-ink:#101817; --accent-text:#5B8CFF;
  --danger:#F0625B; --warn:#FDCA40; --guide:#A065E0; --paper:#FFFFFF; --focus:#E6EEE9; --scrim:rgba(16,24,23,0.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#172120; --panel:#172120; --stage:#101817; --btn:#2A3835; --ink:#E6EEE9; --sub:#98AAA2; --line:#2C3A36; --field:#54685F; --hover:#1F2B29;
  --accent:#5B8CFF; --accent-hover:#5B8CFF; --accent-active:#E6EEE9; --accent-soft:#1F2B29; --accent-ink:#101817; --accent-text:#5B8CFF;

/* sRGB（0〜255）→ インキ量 [c,m,y,k]（0〜255）。格子を三線形補間する */
function rgbInk(r,g,b,out=new Array(4)){const T=jcTab('a'),n=JC_N1-1,s=n/255;

    const x0=a0+(a1-a0)*dg,x1=b0+(b1-b0)*dg;out[c]=x0+(x1-x0)*dr}

const PLAN_KINDS=[['title','扉'],['toc','目次'],['body','本文'],['illust','イラスト'],['colophon','奥付'],['blank','白'],['other','その他']];

function autoDaiwari(sections,opts){
  const d=S.doc;if(d.kind==='cover')return null;opts=Object.assign({unit:4,oddStart:false,colophonLast:true},opts);
  const seq=[];let colophon=null;

  for(const r of g.rows){const vw=w-lw,n=Math.max(1,Math.ceil((gAdv(r.value,sz,F[1],400,false)+0.5)/vw));
    out.push(gT(K,{x,y:r1(yy),w:lw,h:gLine(sz),text:r.label,font:F[1],weight:700,size:sz,color:o.lc||GK(100)}));
    out.push(gT(K,{x:r1(x+lw),y:r1(yy),w:r1(vw),h:r1(gLine(sz)+(n-1)*sz*PT*1.45),text:r.value,font:F[1],size:sz,leading:145,color:o.vc||GK(100)}));
    yy+=lh+(n-1)*sz*PT*1.45}
  return{items:out,h:yy-y}}

function tocAuto(){const d=S.doc,out=[],skip=new Set(PLAN_KINDS.map(k=>k[1]));let prev='';
  d.pages.forEach(p=>{const pl=p.plan||{},t=(pl.title||'').trim();if(t&&t!==prev&&t!==d.name&&!skip.has(t)&&!['toc','colophon','blank'].includes(pl.kind))out.push({title:t,by:'',pid:p.id});prev=t});
  if(out.length)return out;
  /* 台割にタイトルがない書類：太字か12pt以上の文字の1行目を見出しとみなす */
  d.pages.forEach(p=>{for(const it of p.items){if(it.type!=='text'||it.gen||!(it.weight>=700||it.size>=12))continue;const t=String(it.text||'').split('\n')[0].trim();if(t&&t.length<=40&&t!==d.name&&!out.some(o=>o.pid===p.id)){out.push({title:t,by:'',pid:p.id});break}}});
  return out}
function today(){const t=new Date();return `${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日`}
function colDefault(){const d=S.doc,pr=PR();return{title:d.name&&d.name!=='無題'?d.name:'',rows:[{label:'発行日',value:today()+'　初版'},{label:'発行',value:''},{label:'著者',value:''},{label:'連絡先',value:''},{label:'印刷',value:d.printer&&d.printer!=='generic'?pr.name:''}]}}
function genCtx(kind,pi,st){const d=S.doc,m=margBox(pi);
  return Object.assign({m,W:pw(d),H:d.trimH,b:d.bleed,L:isLeft(pi),font:GFONTS[st.font]||GFONTS.sans},kind==='toc'
    ?{heading:st.heading,rows:st.rows.filter(r=>r.title.trim()).map(r=>{const i=d.pages.findIndex(p=>p.id===r.pid);return{title:r.title.trim(),by:(r.by||'').trim(),num:i<0?'':nombreText(i)}})}
    :{title:st.title,rows:st.rows.filter(r=>r.value.trim()).map(r=>({label:r.label.trim(),value:r.value.trim()}))})}
function genItems(kind,pi,st){const D=kind==='toc'?TOC_DESIGNS:COL_DESIGNS,des=D[st.design]||Object.values(D)[0];return des.make(genCtx(kind,pi,st))}
async function genFonts(st){const F=GFONTS[st.font]||GFONTS.sans,s=JSON.stringify(st).slice(0,3000)+'0123456789…';
  await Promise.all([...new Set(F)].flatMap(f=>[400,700].map(w=>document.fonts.load(`${w} 20px "${f}"`,s).catch(()=>{}))));wcache.clear();lcache.clear()}
function genThumb(c,items,wpx){const d=S.doc,W=pw(d),H=d.trimH,dpr=window.devicePixelRatio||1;c.width=Math.round(wpx*dpr);c.height=Math.round(wpx*H/W*dpr);c.style.aspectRatio=W+'/'+H;
  const ctx=c.getContext('2d'),s=c.width/W;ctx.setTransform(s,0,0,s,0,0);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();for(const it of items)drawItem(ctx,it,null,false);ctx.restore();for(const it of items)lcache.delete(it.id)}

const PAPERS={A4:[210,297],B5:[182,257],A3:[297,420],B4:[257,364],'レター':[215.9,279.4],A5:[148,210]};
const HP_EDGE=5;
S.hp={mode:'saddle',paper:'auto',scale:'100',duplex:'short',flip:false,rev:false,marks:true};
function hpPlan(o){
  const d=S.doc,W=pw(d),H=d.trimH,cover=d.kind==='cover',two=!cover&&o.mode==='saddle';
  const n0=d.pages.length,N=two?Math.ceil(n0/4)*4:n0,cw=two?2*W:W;
  const orient=(p)=>{const[a,b]=PAPERS[p];return cw>H?[Math.max(a,b),Math.min(a,b)]:[Math.min(a,b),Math.max(a,b)]};
  const fit=p=>{const[x,y]=orient(p);return cw<=x+0.6&&H<=y+0.6};
  let key=o.paper;
  if(key==='auto'){key=['A4','B5'].filter(fit).sort((a,b)=>PAPERS[a][0]*PAPERS[a][1]-PAPERS[b][0]*PAPERS[b][1])[0]||'A4'}
  const[pW,pH]=orient(key),fits=fit(key);
  const sc=o.scale==='fit'||!fits?Math.min(pW/cw,pH/H):1;
  const ox=(pW-cw*sc)/2,oy=(pH-H*sc)/2;
  const land=pW>pH,duplex=!cover&&o.duplex!=='manual'&&o.duplex!=='simplex';
  const natural=land?'short':'long';
  const sides=[];
  if(two){
    for(let s=0;s<N/4;s++){
      const a=N-1-2*s,b=2*s,c=2*s+1,e=N-2-2*s,R=d.binding==='right';
      sides.push({sheet:s,face:0,pages:R?[b,a]:[a,b]},{sheet:s,face:1,pages:R?[e,c]:[c,e]});
    }
  }else for(let i=0;i<N;i++)sides.push({sheet:cover?0:Math.floor(i/2),face:cover?0:i%2,pages:[i]});
  const rotBack=(o.duplex==='short'||o.duplex==='long'?o.duplex!==natural:false)!==!!o.flip;
  for(const sd of sides)sd.rot=sd.face===1&&rotBack;
  const sheets=cover?1:two?N/4:Math.ceil(N/2);
  return{d,W,H,n0,N,blank:N-n0,two,cover,key,pW,pH,land,fits,sc,ox,oy,cw,sides,sheets,duplex};
}
function hpChecks(P){
  const d=P.d,out=[],edge=[],full=[];
  P.sides.forEach(sd=>sd.pages.forEach((pi,k)=>{
    if(pi>=P.n0)return;const pg=d.pages[pi],cx=P.ox+P.sc*k*P.W;
    const tooClose=(x0,y0,x1,y1)=>{x0=Math.max(x0,0);y0=Math.max(y0,0);x1=Math.min(x1,P.W);y1=Math.min(y1,P.H);if(x1<=x0||y1<=y0)return false;
      const X0=cx+P.sc*x0,X1=cx+P.sc*x1,Y0=P.oy+P.sc*y0,Y1=P.oy+P.sc*y1;return X0<HP_EDGE||Y0<HP_EDGE||X1>P.pW-HP_EDGE||Y1>P.pH-HP_EDGE};
    let e=false,f=false;

    }

      const L=isLeft(pi),x=nb.mode==='center'?P.W/2:nb.mode==='hidden'?(L?P.W-2:2):(L?d.margins.outer:P.W-d.margins.outer);
      if(tooClose(x-h*2,y-h/2,x+h*2,y+h/2))e=true}
    const lab=P.cover?'表紙':nombreText(pi);
    if(e&&!edge.includes(lab))edge.push(lab);if(f&&!full.includes(lab))full.push(lab);
  }));
  const pl=a=>a.length>6?a.slice(0,6).map(x=>'p.'+x).join('、')+` ほか${a.length-6}`:a.map(x=>P.cover?x:'p.'+x).join('、');
  if(!P.fits&&P.sc<1)out.push({lv:'warn',msg:`用紙に収まらないため ${Math.round(P.sc*100)}% に縮小されます`});
  if(edge.length)out.push({lv:'err',msg:`用紙の端から${HP_EDGE}mm以内に文字があります。フチなし印刷でないと欠けます（${pl(edge)}）`});
  if(full.length)out.push({lv:'warn',msg:`ページ端まで届く塗り・画像があります。フチなし印刷でないと端が白くなります（${pl(full)}）`});

  if(P.cover&&P.sc!==1)out.push({lv:'warn',msg:'表紙が実寸ではないため、本文と大きさが合いません'});
  return out;
}
function hpDrawSide(ctx,P,sd,o,test){

  const mx=P.ox/P.sc,my=P.oy/P.sc,bx=Math.min(b,mx),by=Math.min(b,my),n=sd.pages.length;
  sd.pages.forEach((pi,k)=>{

      ctx.strokeStyle='#000000';ctx.lineWidth=0.3/P.sc;ctx.strokeRect(x0,0,P.W,P.H);
      ctx.fillStyle='#000000';ctx.textAlign='center';ctx.textBaseline='middle';
      const lab=pi>=P.n0?'白':P.cover?'表紙':'p.'+nombreText(pi),fs=Math.min(P.W,P.H)*0.22;
      ctx.font=`700 ${fs}px "BIZ UDPGothic", sans-serif`;ctx.fillText(lab,x0+P.W/2,P.H*0.45);
      ctx.font=`700 ${fs*0.35}px "BIZ UDPGothic", sans-serif`;ctx.fillText('▲ 上',x0+P.W/2,P.H*0.12);
    }else{
      ctx.beginPath();ctx.rect(x0-l,-by,P.W+l+r,P.H+2*by);ctx.clip();
      if(pi<P.n0){ctx.translate(x0,0);drawPage(ctx,pi,{ch,preview:false,guides:false})}
    }
    ctx.restore();
  });
  ctx.strokeStyle='#000000';ctx.lineWidth=0.15/P.sc;ctx.beginPath();
  const L=(x1,y1,x2,y2)=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)};
  const cw=P.cw,H=P.H;
  if(o.marks&&!test){
    const ax=Math.min(mx-bx-1,6),ay=Math.min(my-by-1,6);
    for(const [cx,sx] of [[0,-1],[cw,1]])for(const [cy,sy] of [[0,-1],[H,1]]){
      if(ay>=2)L(cx,cy+sy*(by+1),cx,cy+sy*(by+1+ay));
      if(ax>=2)L(cx+sx*(bx+1),cy,cx+sx*(bx+1+ax),cy);
    }
    if(P.two&&ay>=2){L(P.W,-(by+1),P.W,-(by+1+ay));L(P.W,H+by+1,P.W,H+by+1+ay)}
  }
  ctx.stroke();
  if(test){
    ctx.save();ctx.setLineDash([2/P.sc,1.5/P.sc]);ctx.beginPath();if(P.two){L(P.W,0,P.W,H)}ctx.stroke();ctx.restore();
    ctx.fillStyle='#000000';ctx.textAlign='center';ctx.textBaseline='middle';
    const fs=Math.min(cw,H)*0.06;ctx.font=`700 ${fs}px "BIZ UDPGothic", sans-serif`;
    ctx.fillText(`${sd.sheet+1}枚目 ${sd.face?'裏':'表'}`,cw/2,H*0.72);
    const u=100/P.sc,y=H*0.85;ctx.lineWidth=0.3/P.sc;ctx.beginPath();L((cw-u)/2,y,(cw+u)/2,y);L((cw-u)/2,y-2/P.sc,(cw-u)/2,y+2/P.sc);L((cw+u)/2,y-2/P.sc,(cw+u)/2,y+2/P.sc);ctx.stroke();
    ctx.font=`400 ${3.5/P.sc}px "BIZ UDPGothic", sans-serif`;ctx.textBaseline='top';ctx.fillText('100mm',cw/2,y+3/P.sc);
  }
  ctx.restore();
}
function jpegPDF(pages,dup){
  const parts=[];let len=0;const offs=[];
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(id,body,stream)=>{offs[id]=len;push(id+' 0 obj\n'+body);if(stream){push('\nstream\n');push(stream);push('\nendstream')}push('\nendobj\n')};
  push('%PDF-1.7\n');push(new Uint8Array([37,226,227,207,211,10]));
  const f=v=>(Math.round(v*MMPT*1000)/1000).toString(),kids=[];let id=4;
  for(const p of pages){
    const pid=id,cid=id+1,iid=id+2;id+=3;kids.push(pid);
    obj(iid,`<< /Type /XObject /Subtype /Image /Width ${p.px[0]} /Height ${p.px[1]} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>`,p.jpg);
    const cs=`q ${f(p.w)} 0 0 ${f(p.h)} 0 0 cm /Im0 Do Q`;
    obj(cid,`<< /Length ${cs.length} >>`,enc.encode(cs));
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(p.w)} ${f(p.h)}] /Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cid} 0 R >>`);
  }
  const vp=`/ViewerPreferences << /PrintScaling /None /Duplex /${dup==='short'?'DuplexFlipShortEdge':dup==='long'?'DuplexFlipLongEdge':'Simplex'} >>`;
  obj(1,`<< /Type /Catalog /Pages 2 0 R ${vp} >>`);
  obj(2,`<< /Type /Pages /Kids [${kids.map(x=>x+' 0 R').join(' ')}] /Count ${kids.length} >>`);
  obj(3,`<< /Title ${pdfStr(S.doc.name||'無題')} /Creator (HonHon) /Producer (HonHon) >>`);
  const xref=len,N=id;let x=`xref\n0 ${N}\n0000000000 65535 f \n`;for(let j=1;j<N;j++)x+=String(offs[j]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${N} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
async function hpRender(P,o,sides,test,progress){

function tableItem(o){return Object.assign({id:uid(),type:'table',x:0,y:0,w:100,h:40,font:'Noto Sans JP',size:10,color:{c:0,m:0,y:0,k:100},line:{c:0,m:0,y:0,k:100},sw:0.2,link:null,tbl:{cells:[[{t:''}]],cw:[1],rh:[1]}},o)}
function tblGrid(it){const T=it.tbl,sw=T.cw.reduce((a,b)=>a+b,0)||1,sh=T.rh.reduce((a,b)=>a+b,0)||1,X=[it.x],Y=[it.y];
  for(const w of T.cw)X.push(X[X.length-1]+w/sw*it.w);for(const h of T.rh)Y.push(Y[Y.length-1]+h/sh*it.h);return{X,Y}}
function drawTable(ctx,it,ch,preview){
  const T=it.tbl;if(!T||!T.cells.length){return}
  const{X,Y}=tblGrid(it),fs=it.size*PT,pad=Math.min(1.5,fs*0.35),K=100;
  ctx.save();ctx.fillStyle=col(it.color,ch);ctx.textBaseline='middle';
  T.cells.forEach((row,r)=>row.forEach((c,k)=>{
    if(c.skip||!c.t)return;const x0=X[k],x1=X[Math.min(k+(c.cs||1),X.length-1)],y0=Y[r],y1=Y[Math.min(r+(c.rs||1),Y.length-1)],w8=c.b?700:400;
    needFont(it.font,w8,c.t);const ls=String(c.t).split('\n'),a=c.a;
    ctx.save();ctx.beginPath();ctx.rect(x0,y0,x1-x0,y1-y0);ctx.clip();
    ctx.translate(a==='r'?x1-pad:a==='c'?(x0+x1)/2:x0+pad,(y0+y1)/2-(ls.length-1)*fs*0.6);ctx.scale(1/K,1/K);
    ctx.font=`${w8} ${fs*K}px ${FF(it.font)}`;ctx.textAlign=a==='r'?'right':a==='c'?'center':'left';
    ls.forEach((l,j)=>ctx.fillText(l,0,j*fs*1.2*K));ctx.restore();
  }));
  if(it.line&&it.sw>0){ctx.strokeStyle=col(it.line,ch);ctx.lineWidth=it.sw;ctx.beginPath();
    T.cells.forEach((row,r)=>row.forEach((c,k)=>{if(c.skip)return;const x0=X[k],x1=X[Math.min(k+(c.cs||1),X.length-1)],y0=Y[r],y1=Y[Math.min(r+(c.rs||1),Y.length-1)];ctx.rect(x0,y0,x1-x0,y1-y0)}));ctx.stroke()}
  else if(preview&&S.guides){ctx.strokeStyle=TOK.line;ctx.lineWidth=0.2;ctx.setLineDash([1,1]);ctx.strokeRect(it.x,it.y,it.w,it.h)}
  ctx.restore();
}
function tblItems(fn){const d=S.doc,out=[];if(!d)return out;d.pages.forEach((pg,i)=>pg.items.forEach(it=>{if(it.type==='table'&&(!fn||fn(it)))out.push({it,i})}));return out}
async function tblRefresh(it){const s=await XL.snap(it.link.sheet,it.link.range);if(!s)return false;

const N8={list:[],cur:null,q:'',tag:'',open:false,t:0};
const netaEl=$('#neta');
function netaSave(){clearTimeout(N8.t);N8.t=setTimeout(()=>kvSet('neta',N8.list),400)}
function netaTags(s){return[...new Set(String(s).split(/[,、，\s]+/).map(x=>x.replace(/^#/,'').trim()).filter(Boolean))]}
function netaDate(t){const d=new Date(t);return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}
function netaCur(){return N8.list.find(n=>n.id===N8.cur)||null}

/* ---------- Tehon sync (ネタ帳 ⇄ Tehon) ----------
   Tehon (https://tehon.pikoponpoko.workers.dev) keeps its library in Dropbox (App folder「アプリ/Tehon」).
   HonHon signs in to the same Dropbox app (PKCE, App key only, a small window that comes back to /tehon-auth/),
   and keeps each ネタ as a text file in /ネタ帳 there: file name = title, contents = body, Tehon's tags = tags.
   Only text goes across (images stay in this browser). Notes are tied to files by Dropbox id (renames and edits on
   either side follow), n.tehon = {id, rev, path, at, tags}: `at` is n.updated at the last sync, `tags` the tags then.
   Tags are written to HonHon's own Tehon device file (/.tehon/devices/honhon-*.json), the way each Tehon device does. */
const TH_URL='https://tehon.pikoponpoko.workers.dev/',TH_KEY='x7ap0g0pau1irkc',TH_DIR='/ネタ帳',TH_META='/.tehon/devices';
const TH={on:false,can:!window.claude&&/^https?:$/.test(location.protocol),busy:false,again:false,timer:0,deb:0,access:null,dev:null,devCache:new Map(),own:null,err:''};
const thB64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const thRedirect=()=>location.origin+'/tehon-auth/';
class ThErr extends Error{constructor(s,b){super('Dropbox '+s);this.status=s;this.body=b||''}get summary(){try{return JSON.parse(this.body).error_summary||''}catch(e){return''}}}
let thKeyP=null;
function thCryptoKey(){return thKeyP||(thKeyP=(async()=>{let k=await kvGet('tehonKey');if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await kvWrite('tehonKey',k)}return k})().catch(e=>{thKeyP=null;throw e}))}
async function thSaveSecret(v){const iv=crypto.getRandomValues(new Uint8Array(12));await kvWrite('tehonRefresh',{iv,data:await crypto.subtle.encrypt({name:'AES-GCM',iv},await thCryptoKey(),new TextEncoder().encode(v))})}
async function thLoadSecret(){const v=await kvGet('tehonRefresh');if(!v)return null;try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:v.iv},await thCryptoKey(),v.data))}catch(e){return null}}
async function thToken(body){const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({client_id:TH_KEY,...body})});
  if(!r.ok)throw new ThErr(r.status,await r.text());const j=await r.json();TH.access={token:j.access_token,exp:Date.now()+(j.expires_in-60)*1000};if(j.refresh_token)await thSaveSecret(j.refresh_token)}
let thRefreshing=null;
async function thAccess(){if(TH.access&&Date.now()<TH.access.exp)return TH.access.token;
  return thRefreshing||(thRefreshing=(async()=>{const rt=await thLoadSecret();if(!rt)throw new ThErr(401,'not connected');
    try{await thToken({grant_type:'refresh_token',refresh_token:rt})}catch(e){if(e.status===400){await kvDel('tehonRefresh');throw new ThErr(401,e.body)}throw e}
    return TH.access.token})().finally(()=>{thRefreshing=null}))}
// Dropbox-API-Arg must be ASCII (Japanese names are escaped)
const thArg=o=>JSON.stringify(o).replace(/[\u007f-￿]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
async function thCall(url,init,tries=0){const h=new Headers(init.headers);h.set('Authorization','Bearer '+await thAccess());const r=await fetch(url,{...init,headers:h});
  if(r.status===401&&!tries){TH.access=null;return thCall(url,init,1)}
  if((r.status===429||r.status>=500)&&tries<4){await new Promise(s=>setTimeout(s,Number(r.headers.get('Retry-After'))*1000||500*2**tries));return thCall(url,init,tries+1)}
  if(!r.ok)throw new ThErr(r.status,await r.text());return r}
async function thRpc(p,arg){const r=await thCall('https://api.dropboxapi.com/2/'+p,arg===null?{method:'POST'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(arg)});const t=await r.text();return t?JSON.parse(t):null}
const thDown=path=>thCall('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':thArg({path})}});
const thUp=(arg,body)=>thCall('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','Dropbox-API-Arg':thArg({mute:true,...arg})},body}).then(r=>r.json());
const thNotFound=e=>e instanceof ThErr&&/not_found/.test(e.summary);
async function thList(path){const out=[];let r;try{r=await thRpc('files/list_folder',{path,recursive:true,limit:2000})}catch(e){if(thNotFound(e))return null;throw e}
  for(;;){out.push(...r.entries);if(!r.has_more)return out;r=await thRpc('files/list_folder/continue',{cursor:r.cursor})}}
// sign in: must be called from a click (the window is opened at once)
function thConnect(){const win=window.open('about:blank','tehon-auth','width=560,height=720');if(!win){toast('ポップアップを許可してください');return}
  (async()=>{const verifier=thB64(crypto.getRandomValues(new Uint8Array(48))),challenge=thB64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))),state=thB64(crypto.getRandomValues(new Uint8Array(16)));
    win.location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:TH_KEY,response_type:'code',code_challenge:challenge,code_challenge_method:'S256',redirect_uri:thRedirect(),token_access_type:'offline',scope:'files.metadata.read files.content.read files.content.write',state});
    const got=await new Promise(res=>{const done=v=>{removeEventListener('message',on);clearInterval(t);res(v)};const on=e=>{if(e.origin===location.origin&&e.data&&e.data.tehonAuth!=null)done(e.data.tehonAuth)};addEventListener('message',on);const t=setInterval(()=>{if(win.closed)done(null)},600)});
    try{win.close()}catch(e){}if(!got)return;const u=new URLSearchParams(got);if(u.get('error')||u.get('state')!==state||!u.get('code'))return thState('接続できませんでした',1);
    await thToken({code:u.get('code'),grant_type:'authorization_code',code_verifier:verifier,redirect_uri:thRedirect()});
    TH.on=true;thUi();thSchedule();thSync()})().catch(()=>thState('接続できませんでした',1))}
async function thDisconnect(){try{await thRpc('auth/token/revoke',null)}catch(e){}TH.access=null;TH.on=false;await kvDel('tehonRefresh');clearInterval(TH.timer);thUi()}
function thState(t,err){TH.err=err?t:'';const s=$('#nThSt');if(!s)return;s.textContent=t;s.classList.toggle('err',!!err)}
function thUi(){const b=$('#nTehon');if(!b)return;b.hidden=!TH.can;b.textContent=TH.on?'Tehon':'Tehonと同期';$('#nThSt').hidden=!TH.on}
const thName=s=>(String(s||'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/^[\s.]+|[\s.]+$/g,'').slice(0,80)||'無題');
const thTitle=name=>name.replace(/\.(md|txt)$/i,'');
const thTagsKey=t=>JSON.stringify([...(t||[])].sort());
// Tehon's tags and trash, merged over every device file (newest wins), as Tehon reads them. Unchanged files are not downloaded again.
async function thMeta(){const items={},seen=new Set();const fs=(await thList(TH_META))||[];
  for(const f of fs.filter(x=>x['.tag']==='file'&&x.name.endsWith('.json'))){seen.add(f.id);let c=TH.devCache.get(f.id);
    if(!c||c.rev!==f.rev){try{c={rev:f.rev,d:await (await thDown(f.id)).json()};TH.devCache.set(f.id,c)}catch(e){continue}}
    const d=c.d||{};if(d.device===TH.dev&&!TH.own)TH.own=d;
    for(const [k,v] of Object.entries(d.items||{}))if(!items[k]||items[k].updatedAt<v.updatedAt)items[k]=v}
  for(const k of TH.devCache.keys())if(!seen.has(k))TH.devCache.delete(k);
  if(!TH.own)TH.own={version:1,device:TH.dev,items:{},urls:{}};return items}
async function thText(id){const r=await thDown(id),buf=await r.arrayBuffer();const m=JSON.parse(r.headers.get('Dropbox-API-Result')||'{}');
  try{return{text:new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,''),meta:m}}catch(e){return null}}
const thOk=f=>f['.tag']==='file'&&/\.(md|txt)$/i.test(f.name)&&!(f.size>2e6);
const thTime=s=>{const t=Date.parse(s||'');return isFinite(t)?t:Date.now()};
async function thSync(){if(!TH.on)return;if(TH.busy){TH.again=true;return}TH.busy=true;TH.again=false;thState('同期中…');let changed=false;
  try{
    if(!TH.dev){TH.dev=await kvGet('tehonDevice');if(!TH.dev){TH.dev='honhon-'+thB64(crypto.getRandomValues(new Uint8Array(9)));await kvWrite('tehonDevice',TH.dev)}}
    let files=await thList(TH_DIR);if(!files){try{await thRpc('files/create_folder_v2',{path:TH_DIR,autorename:false})}catch(e){if(!/path\/conflict/.test(e.summary||''))throw e}files=[]}
    if(!TH.folder)try{TH.folder=(await thRpc('files/get_metadata',{path:TH_DIR})).id}catch(e){}
    const meta=await thMeta(),live=f=>f&&thOk(f)&&!(meta[f.id]&&meta[f.id].trashed);
    const byId=new Map(files.filter(f=>f['.tag']==='file').map(f=>[f.id,f])),linked=new Set();
    // deleted in HonHon: to Dropbox's deleted files (restorable there)
    const del=(await kvGet('tehonDel'))||[];
    if(del.length){for(const id of del){try{await thRpc('files/delete_v2',{path:id})}catch(e){if(!thNotFound(e))throw e}byId.delete(id)}await kvWrite('tehonDel',[])}
    const tagPut={};
    for(const n of [...N8.list]){const L=n.tehon;if(!L)continue;const f=byId.get(L.id);
      if(!live(f)){// gone from Tehon (deleted, trashed or moved out of ネタ帳): drop it here, unless it was changed here since
        if(n.updated>L.at)delete n.tehon;else N8.list=N8.list.filter(x=>x!==n);changed=true;continue}
      linked.add(f.id);const mine=n.updated>L.at,mineTags=thTagsKey(n.tags)!==L.tags,rt=(meta[f.id]&&meta[f.id].tags)||[];
      if(f.rev!==L.rev){const stamp=n.updated,got=await thText(f.id);if(!got||!N8.list.includes(n))continue;
        if(n.updated!==stamp){TH.again=true;continue}// typed while it was coming: try again next round
        if(mine){// changed on both sides: keep HonHon's version as a new ネタ (uploaded as its own file)
          const t=Date.now();N8.list.push({...n,id:uid(),title:(n.title||'無題')+'（HonHon）',images:[...n.images],created:t,updated:t,tehon:undefined});toast('Tehonでも変更されていたため、こちらの変更を別のネタにしました')}
        n.title=thTitle(f.name);n.body=got.text;if(!mineTags)n.tags=[...rt];n.updated=Math.max(n.updated,thTime(f.server_modified));
        n.tehon={id:f.id,rev:f.rev,path:f.path_display,at:n.updated,tags:thTagsKey(rt)};changed=true;netaLive(n);continue}
      if(f.path_display!==L.path){if(!mine){n.title=thTitle(f.name);netaLive(n)}L.path=f.path_display;changed=true}
      if(thTagsKey(rt)!==L.tags&&!mineTags){n.tags=[...rt];L.tags=thTagsKey(rt);changed=true;netaLive(n)}
      if(mine){const stamp=n.updated,body=n.body,want=thName(n.title)+(/\.txt$/i.test(f.name)?'.txt':'.md');let path=f.path_display;
        if(want!==f.name){const m=(await thRpc('files/move_v2',{from_path:f.id,to_path:path.replace(/[^/]*$/,'')+want,autorename:true})).metadata;path=m.path_display}
        try{const m=await thUp({path,mode:{'.tag':'update',update:f.rev},autorename:false},new TextEncoder().encode(body));Object.assign(L,{rev:m.rev,path:m.path_display,at:stamp})}
        catch(e){if(e.status===409){TH.again=true;continue}throw e}changed=true}
      if(thTagsKey(n.tags)!==L.tags)tagPut[f.id]=n}
    // new in Tehon
    for(const f of byId.values()){if(linked.has(f.id)||!live(f)||N8.list.some(n=>n.tehon&&n.tehon.id===f.id))continue;const got=await thText(f.id);if(!got)continue;
      const rt=(meta[f.id]&&meta[f.id].tags)||[],t=thTime(f.server_modified);

  finally{TH.busy=false;if(changed){N8.list.sort((a,b)=>b.updated-a.updated);netaSave();if(N8.open){if(N8.cur&&!netaCur())N8.cur=(N8.list[0]||{}).id||null;netaRenderList();if(!netaCur()||!$('#nTitle'))netaRenderEdit()}}

function touch(){DW.dirty=true;DW.confirm=false;$('#dw-apply').textContent='冊子に反映'}

function renderDW(focus){

  tb.innerHTML=DW.rows.map((r,i)=>`<tr data-i="${i}" class="${rowCls(i)}"><th draggable="true">${st+i}</th><td><input data-c="0" list="dw-kinds" value="${esc(KIND_LABEL[r.kind])}" aria-label="種類"></td><td><input data-c="1" value="${esc(r.title)}" aria-label="タイトル"></td><td><input data-c="2" value="${esc(r.note)}" aria-label="メモ"></td></tr>`).join('');

function moveRows(dir){const s=selRows();if(!s.length)return;if(dir<0&&s[0]===0||dir>0&&s[s.length-1]===DW.rows.length-1)return;
  const order=dir<0?s:[...s].reverse();for(const i of order){const t=DW.rows[i];DW.rows[i]=DW.rows[i+dir];DW.rows[i+dir]=t}
  DW.sel=new Set(s.map(i=>i+dir));if(DW.cur!=null)DW.cur+=dir;touch();const a=document.activeElement,c=a&&a.dataset?a.dataset.c:null;renderDW(c!=null&&DW.cur!=null?[DW.cur,+c]:null)}
function onCellKey(e){
  const inp=e.target;if(inp.tagName!=='INPUT')return;const i=rowOf(inp),c=+inp.dataset.c,mod=e.ctrlKey||e.metaKey;
  const go=(r,cc)=>{const el=cell(clamp(r,0,DW.rows.length-1),clamp(cc,0,2));if(el){e.preventDefault();el.focus();el.select()}};
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();moveRows(e.key==='ArrowUp'?-1:1);return}
  if(e.key==='ArrowUp'&&!e.shiftKey)return go(i-1,c);
  if(e.key==='ArrowDown'&&!e.shiftKey){if(c===0&&e.altKey)return;return go(i+1,c)}
  if(e.key==='Enter'&&!e.isComposing){if(c===0)inp.dispatchEvent(new Event('change',{bubbles:true}));if(!e.shiftKey&&i===DW.rows.length-1){e.preventDefault();DW.rows.push(blankRow());touch();renderDW([i+1,c]);return}return go(e.shiftKey?i-1:i+1,c)}
  if(e.key==='ArrowLeft'&&inp.selectionStart===0&&inp.selectionEnd===0)return go(i,c-1);
  if(e.key==='ArrowRight'&&inp.selectionStart===inp.value.length)return go(i,c+1);
  if(mod&&e.key.toLowerCase()==='d'&&i>0){e.preventDefault();const r=DW.rows[i],p=DW.rows[i-1];if(c===0)r.kind=p.kind;else if(c===1)r.title=p.title;else r.note=p.note;touch();renderDW([Math.min(i+1,DW.rows.length-1),c]);return}
  if((e.key==='Delete'||e.key==='Backspace')&&DW.sel.size>1){e.preventDefault();$('#dw-del').click()}
}
function onPaste(e){
  const inp=e.target;if(inp.tagName!=='INPUT')return;const t=(e.clipboardData.getData('text/plain')||'').replace(/\r/g,'').replace(/\n+$/,'');
  if(!/[\t\n]/.test(t))return;e.preventDefault();

  if(c0===0&&lines[0].length>=2&&lines.every(l=>/^\s*(p\.?\s*)?\d*\s*$/i.test(l[0])))lines=lines.map(l=>l.slice(1));
  lines.forEach((l,k)=>{const i=r0+k;while(DW.rows.length<=i)DW.rows.push(blankRow());const r=DW.rows[i];
    l.forEach((v,j)=>{const c=c0+j;if(c===0)r.kind=kindOf(v);else if(c===1)r.title=v.trim();else if(c===2)r.note=v.trim()})});
  touch();renderDW([r0,c0]);
}

async function shrinkImage(f){const bmp=await createImageBitmap(f);const k=Math.min(1,1568/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');
  c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.88))}
const DW_PROMPT=`画像は冊子（同人誌など）の台割ラフで、紙に手書きされたものです。画像が複数ある場合は続きのページとしてまとめて1つのJSONにしてください。各ページの内容を読み取り、次の形式のJSONだけを返してください。
{"bookTitle": string|null, "total": number|null, "pages": [{"from": number, "to": number, "kind": "body"|"title"|"toc"|"illust"|"colophon"|"blank"|"other", "title": string, "note": string}]}
例: {"bookTitle":"夏の本","total":24,"pages":[{"from":1,"to":1,"kind":"title","title":"夏の本","note":""},{"from":2,"to":2,"kind":"toc","title":"","note":""},{"from":3,"to":12,"kind":"body","title":"第一話","note":""}]}
- from/to は本文のページ番号（1始まり、範囲の両端を含む）。表紙（表1〜表4）は含めない。
- kind: body=本文・漫画・小説、title=扉・中扉、toc=目次、illust=イラスト・口絵、colophon=奥付、blank=白・空白ページ、other=広告・あとがき・その他。
- title はそのページに書かれた作品名・章題・見出し。なければ空文字。
- note はそれ以外の書き込み（カラー、ゲスト名、見開き など）。なければ空文字。
- total は総ページ数。書かれていなければ最後のページ番号。
- ページ番号がない場合は、枠の並び順（右綴じなら右から左、上から下）で数える。
- 読めない文字は推測せず、読めた部分だけを入れる。
専用記入用紙（上部に「HonHon 台割」と印字、四隅に黒い四角、ページごとの枠）の場合:
- 各枠の左上の太字の数字が印字済みのページ番号。これをそのまま from/to に使う。
- 種類は枠内のチェックボックス（本文・扉・目次・イラスト・奥付・白）のうち、レ点・×・塗りつぶし・丸囲みのあるもの。何も印がなく、タイトルもメモも空なら、その枠は出力しない。
- 「タイトル」欄の手書きを title、「メモ」欄の手書きを note にする。「〃」「同上」や前の枠から続く矢印・線は、前のページと同じ種類・タイトルを意味する。
- 用紙上部の「書名」欄を bookTitle、「総ページ数」欄を total にする。`;
function apiKey(){if(DW.key)return DW.key;try{return localStorage.getItem('thinbook.apikey')||''}catch(e){return''}}
async function callApi(key,blobs){
  const b64s=await Promise.all(blobs.map(blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})));
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:8000,messages:[{role:'user',content:[...b64s.map(data=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data}})),{type:'text',text:DW_PROMPT}]}]})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401){try{localStorage.removeItem('thinbook.apikey')}catch(e){}DW.key=''}throw new Error((j.error&&j.error.message)||'HTTP '+r.status)}
  const t=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('結果を読み取れませんでした');return JSON.parse(m[0]);
}
async function analyzeRough(){
  if(!(DW.blobs&&DW.blobs.length)||DW.busy)return;
  const btns=['#dw-load','#dw-re','#dw-apply'];const busy=v=>{DW.busy=v;btns.forEach(s=>{const b=$(s);if(b)b.disabled=v})};
  busy(true);setMsg('解析中…');
  try{
    const smp=smpCap&&await smpCap;const lim=smp?await smp.limits().catch(()=>null):null;let out;
    if(lim&&lim.images){const mx=lim.images.maxCount||DW.blobs.length;out=await smp.json(DW_PROMPT,{images:DW.blobs.slice(0,mx),modelTier:'default'})}
    else{const k=apiKey();if(!k){setMsg('');$('#dw-key').hidden=false;$('#dw-keyv').focus();return}out=await callApi(k,DW.blobs)}
    fillFromRough(out);setMsg('');toast('ラフを読み込みました（'+DW.rows.length+'ページ）');
  }catch(e){
    if(e&&e.code==='not_granted')setMsg('画像の解析が許可されていません',true);
    else if(e&&e.code==='rate_limited')setMsg('混み合っています。しばらくしてから再解析してください',true);
    else setMsg('解析できませんでした：'+((e&&(e.message||e.code))||e),true);
  }finally{busy(false)}
}
function fillFromRough(o){
